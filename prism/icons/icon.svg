<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Prism">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1738"/>
      <stop offset="1" stop-color="#0e0d17"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- white light entering the left face -->
  <path d="M56 256 H182" stroke="#fdfcff" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  <!-- split into distinct wavelengths, all leaving one refraction point on the right face -->
  <g stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M330 250 L462 178" stroke="#f87171"/>
    <path d="M330 252 L466 226" stroke="#fbbf24"/>
    <path d="M330 256 L466 276" stroke="#4ade80"/>
    <path d="M330 258 L458 326" stroke="#38bdf8"/>
  </g>
  <!-- the prism -->
  <path d="M256 128 L392 352 H120 Z" fill="none" stroke="#a78bfa" stroke-width="26" stroke-linejoin="round"/>
</svg>

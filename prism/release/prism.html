<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism</title>
<meta name="description" content="Prism: visual, bite-sized lessons in psychology, philosophy, money and more — with built-in spaced repetition so it actually sticks.">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0d17" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prism">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3L30 27H2z' fill='none' stroke='%238b5cf6' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Prism — design system
   Light tokens on :root; dark via prefers-color-scheme and
   an explicit [data-theme] override in both directions.
   ============================================================ */

:root {
  --ah: 262;                       /* default accent hue; overridden per course */
  --bg: #faf8f4;
  --bg-glow: radial-gradient(1100px 500px at 85% -10%, hsl(var(--ah) 60% 60% / .10), transparent 60%);
  --surface: #ffffff;
  --surface-2: #f3f1ea;
  --ink: #1c1a2e;
  --mut: #6d6a80;
  --line: #e8e4da;
  --accent: hsl(var(--ah) 68% 46%);
  --accent-strong: hsl(var(--ah) 72% 40%);
  --accent-soft: hsl(var(--ah) 68% 46% / .11);
  --accent-line: hsl(var(--ah) 60% 50% / .35);
  --good: #1e9e6a;
  --good-soft: #1e9e6a1c;
  --bad: #d64550;
  --bad-soft: #d6455019;
  --gold: #b3790e;
  --on-status: #ffffff;
  --flame: #b55015;
  --think: #6a48c8;
  --shadow: 0 1px 2px #14122008, 0 8px 28px #14122010;
  --shadow-lift: 0 2px 4px #1412200a, 0 14px 44px #1412201c;
  --radius: 18px;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-ui: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d17;
    --bg-glow: radial-gradient(1100px 520px at 85% -10%, hsl(var(--ah) 70% 55% / .13), transparent 60%);
    --surface: #171526;
    --surface-2: #1f1d31;
    --ink: #f0eefa;
    --mut: #9d9ab2;
    --line: #2a2840;
    --accent: hsl(var(--ah) 85% 66%);
    --accent-strong: hsl(var(--ah) 90% 72%);
    --accent-soft: hsl(var(--ah) 85% 66% / .13);
    --accent-line: hsl(var(--ah) 70% 66% / .38);
    --good: #34c98a;
    --good-soft: #34c98a24;
    --bad: #ff6b74;
    --bad-soft: #ff6b7421;
    --gold: #f5b942;
    --on-status: #14121f;
    --flame: #ff8a4d;
    --think: #b9a5f2;
    --shadow: 0 1px 2px #00000030, 0 8px 28px #00000038;
    --shadow-lift: 0 2px 4px #00000035, 0 16px 48px #00000055;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0d17;
  --bg-glow: radial-gradient(1100px 520px at 85% -10%, hsl(var(--ah) 70% 55% / .13), transparent 60%);
  --surface: #171526;
  --surface-2: #1f1d31;
  --ink: #f0eefa;
  --mut: #9d9ab2;
  --line: #2a2840;
  --accent: hsl(var(--ah) 85% 66%);
  --accent-strong: hsl(var(--ah) 90% 72%);
  --accent-soft: hsl(var(--ah) 85% 66% / .13);
  --accent-line: hsl(var(--ah) 70% 66% / .38);
  --good: #34c98a;
  --good-soft: #34c98a24;
  --bad: #ff6b74;
  --bad-soft: #ff6b7421;
  --gold: #f5b942;
  --on-status: #14121f;
  --flame: #ff8a4d;
  --think: #b9a5f2;
  --shadow: 0 1px 2px #00000030, 0 8px 28px #00000038;
  --shadow-lift: 0 2px 4px #00000035, 0 16px 48px #00000055;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  background-image: var(--bg-glow);
  background-attachment: fixed;
  color: var(--ink);
  line-height: 1.55;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }

/* ---------------- layout chrome ---------------- */

.page { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }
.page.center { display: flex; align-items: center; justify-content: center; min-height: 70vh; }

.topbar {
  max-width: 980px; margin: 0 auto; padding: 18px 20px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.brand-mark { width: 26px; height: 26px; color: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow);
}
.chip svg { width: 15px; height: 15px; }
.chip.streak { color: var(--mut); }
.chip.streak.lit { color: var(--flame); border-color: #e86a2b44; background: #e86a2b14; }
.chip.xp { color: var(--gold); }
.iconbtn {
  width: 36px; height: 36px; border-radius: 12px; display: inline-flex;
  align-items: center; justify-content: center; color: var(--mut);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  transition: color .15s, transform .15s;
}
.iconbtn:hover { color: var(--ink); transform: translateY(-1px); }
.iconbtn svg { width: 19px; height: 19px; }

.back { display: inline-block; margin: 14px 0 4px; color: var(--mut); font-weight: 600; font-size: 14.5px; }
.back:hover { color: var(--ink); }
.section-title { font-size: 21px; margin: 34px 0 14px; }
.page-title { font-size: 32px; margin: 10px 0 20px; }

/* ---------------- hero ---------------- */

.hero {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 34px 0 6px;
}
.hero h1 { font-size: clamp(28px, 4.6vw, 42px); line-height: 1.12; max-width: 560px; }
.hero .sub { color: var(--mut); margin-top: 10px; max-width: 520px; font-size: 16px; }
.hero-ring { flex: 0 0 auto; }
.hero h1 { overflow-wrap: anywhere; }
@media (max-width: 560px) { .hero { flex-direction: column-reverse; align-items: flex-start; gap: 14px; } }

.ring-bg { fill: none; stroke: var(--line); stroke-width: 7; }
.ring-fg {
  fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round;
  transform: rotate(-90deg); transform-origin: 40px 40px;
  transition: stroke-dashoffset .6s cubic-bezier(.3,.7,.3,1);
}
.ring-label { font: 700 15px var(--font-ui); fill: var(--ink); }
.ring-sub { font: 600 9px var(--font-ui); fill: var(--mut); }

/* ---------------- action cards ---------------- */

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
@media (max-width: 720px) { .actions { grid-template-columns: 1fr; } }

.action-card {
  position: relative; display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow);
  transition: transform .16s, box-shadow .16s;
}
.action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.action-card h3 { font-size: 17px; font-family: var(--font-ui); font-weight: 700; }
.action-card p { color: var(--mut); font-size: 13.5px; margin-top: 2px; }
.action-art { width: 74px; flex: 0 0 auto; }
.action-art svg { width: 100%; height: auto; }
.badge {
  position: absolute; top: -8px; right: -6px; min-width: 26px; height: 26px; padding: 0 7px;
  background: var(--bad); color: var(--on-status); border-radius: 999px;
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow);
}
.go { margin-left: auto; color: var(--mut); font-size: 22px; }

/* ---------------- course covers ---------------- */

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

.cover {
  display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  transition: transform .18s, box-shadow .18s;
}
.cover:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.cover-top {
  position: relative; padding: 14px 16px 4px; min-height: 128px;
  background:
    radial-gradient(420px 200px at 110% -30%, hsl(calc(var(--ah) + 42) 75% 60% / .34), transparent 60%),
    linear-gradient(135deg, hsl(var(--ah) 70% 55% / .22), hsl(var(--ah) 70% 45% / .07));
}
.cover .cat, .course-hero .cat {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--accent-strong);
  background: var(--accent-soft); padding: 3px 9px; border-radius: 999px;
}
.cover-art { width: 118px; margin: 2px auto 0; }
.cover-art svg, .course-hero-art svg, .card-art svg, .empty svg { width: 100%; height: auto; }
.cover-body { padding: 13px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cover-body h3 { font-size: 19px; }
.cover-body p { color: var(--mut); font-size: 13.5px; flex: 1; }
.cover-meta { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
.cover-meta span { color: var(--mut); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.cover-meta.wide { max-width: 380px; }

.bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s cubic-bezier(.3,.7,.3,1); }
.bar.tall { height: 9px; margin: 10px 0 6px; }

/* ---------------- SVG art palette ---------------- */

.s  { stroke: var(--ink); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.w  { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .3; }
.a  { stroke: var(--accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.d  { fill: var(--accent); }
.f  { fill: var(--accent); opacity: .14; stroke: none; }
ellipse.w, circle.w[stroke-dasharray] { fill: none; }

/* ---------------- course page ---------------- */

.course-hero { display: flex; gap: 28px; align-items: center; margin: 12px 0 26px; }
.course-hero-art {
  flex: 0 0 220px; padding: 18px; border-radius: 22px;
  background:
    radial-gradient(300px 170px at 110% -20%, hsl(calc(var(--ah) + 42) 75% 60% / .3), transparent 60%),
    linear-gradient(135deg, hsl(var(--ah) 70% 55% / .2), hsl(var(--ah) 70% 45% / .06));
  border: 1px solid var(--line);
}
.course-hero h1 { font-size: clamp(26px, 4vw, 38px); margin: 8px 0 2px; }
.course-hero .tagline { color: var(--accent-strong); font-weight: 600; font-size: 16px; }
.course-hero .desc { color: var(--mut); margin: 8px 0 14px; max-width: 560px; }
@media (max-width: 680px) {
  .course-hero { flex-direction: column; align-items: flex-start; gap: 14px; }
  .course-hero-art { flex-basis: auto; width: 180px; }
}

.lessons { display: flex; flex-direction: column; gap: 10px; }
.lesson-row {
  display: flex; align-items: center; gap: 15px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 18px; box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
}
.lesson-row:hover { transform: translateX(3px); box-shadow: var(--shadow-lift); }
.lesson-n {
  flex: 0 0 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-strong);
  font-weight: 700; font-size: 16px;
}
.lesson-row.done .lesson-n { background: var(--good-soft); color: var(--good); }
.lesson-n svg { width: 20px; height: 20px; }
.lesson-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lesson-txt b { font-size: 16px; }
.lesson-txt small { color: var(--mut); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-side { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.lesson-side em { font-style: normal; font-weight: 700; color: var(--good); font-size: 14px; }
.lesson-side em.mut { color: var(--mut); font-weight: 600; font-size: 12.5px; }
@media (max-width: 560px) { .lesson-side em.mut { display: none; } .lesson-txt small { white-space: normal; } }

/* ---------------- lesson player ---------------- */

.player {
  max-width: 720px; margin: 0 auto; padding: 18px 20px 30px;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
}
.player-top { display: flex; align-items: center; gap: 14px; }
.segments { display: flex; gap: 5px; flex: 1; }
.segments i { height: 5px; border-radius: 99px; background: var(--surface-2); flex: 1; transition: background .3s; }
.segments i.past { background: var(--accent); }
.segments i.now { background: var(--accent); opacity: .45; }
.player-xp { font-weight: 700; font-size: 14px; color: var(--gold); min-width: 44px; text-align: right; }
.review-count { flex: 1; text-align: center; color: var(--mut); font-weight: 600; font-size: 14px; }

.card-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 26px 0; }
.card {
  width: 100%; max-width: 620px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  box-shadow: var(--shadow-lift);
  padding: 34px 34px 30px;
  animation: card-in .34s cubic-bezier(.25,.8,.35,1);
}
@keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@media (max-width: 560px) { .card { padding: 26px 20px 22px; } }

.card-art { width: 190px; margin: 0 auto 14px; }
.card-art.small { width: 130px; }
.kicker {
  display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent-strong);
  background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px;
}
.kicker.quiz { color: var(--gold); background: #e8a02021; }
.kicker.think { color: var(--think); background: #7c5cd61f; }
.card h2 { font-size: clamp(22px, 3.4vw, 28px); line-height: 1.2; margin-bottom: 10px; }
.card .body { font-size: 16.5px; line-height: 1.65; color: var(--ink); opacity: .92; }
.card h2.prompt { font-size: clamp(20px, 3vw, 24px); }

.quote-mark { font-family: var(--font-display); font-size: 84px; line-height: .6; color: var(--accent); margin: 10px 0 6px; }
blockquote { font-family: var(--font-display); font-size: clamp(20px, 3.2vw, 26px); line-height: 1.4; font-style: italic; }
cite { display: block; margin-top: 16px; color: var(--mut); font-style: normal; font-weight: 600; }

.recap { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.recap li {
  display: flex; gap: 11px; align-items: flex-start; font-size: 15.5px;
  animation: rise .4s both cubic-bezier(.25,.8,.35,1);
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.recap svg { width: 20px; height: 20px; flex: 0 0 auto; margin-top: 2px; color: var(--good); }

.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.choices.tf { flex-direction: row; }
.choices.tf .choice { justify-content: center; font-weight: 700; }
.choice {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 13px 16px; border-radius: 14px; font-size: 15.5px;
  background: var(--surface-2); border: 1.6px solid var(--line);
  transition: border-color .14s, background .14s, transform .1s;
}
.choice:not(:disabled):hover { border-color: var(--accent-line); transform: translateY(-1px); }
.choice .key {
  flex: 0 0 24px; height: 24px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--mut);
}
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.right .key { background: var(--good); border-color: var(--good); color: var(--on-status); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.choice.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--on-status); }
.choice:disabled { cursor: default; opacity: .92; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.explain {
  margin-top: 16px; padding: 13px 15px; border-radius: 13px; font-size: 14.5px; line-height: 1.55;
  animation: rise .3s both;
}
.explain.good { background: var(--good-soft); border: 1px solid #1e9e6a3d; }
.explain.bad { background: var(--bad-soft); border: 1px solid #d645503d; }
.explain b { display: inline-block; margin-right: 4px; }

.reveal-slot { margin-top: 20px; }
.reveal-answer {
  padding: 16px 18px; border-radius: 14px; font-size: 16px; line-height: 1.6;
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  animation: rise .35s both;
}

.player-foot { display: flex; justify-content: center; align-items: center; min-height: 64px; }
.player-foot.col { flex-direction: column; gap: 10px; }
.hint { color: var(--mut); font-size: 13.5px; font-weight: 500; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 13px 30px; border-radius: 999px; font-size: 15.5px; font-weight: 700;
  transition: transform .12s, box-shadow .12s, background .15s;
}
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 20px hsl(var(--ah) 70% 45% / .35); }
:root[data-theme="dark"] .btn.primary { color: #14121f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #14121f; } }
.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 9px 26px hsl(var(--ah) 70% 45% / .45); }
.btn.primary:active { transform: translateY(0); }
.btn.ghost { background: var(--surface); border: 1.4px solid var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--accent-line); }

/* completion */
.done-card { text-align: center; }
.done-card .card-art { width: 200px; }
.done-stats { display: flex; justify-content: center; gap: 34px; margin-top: 20px; }
.done-stats .stat { display: flex; flex-direction: column; }
.done-stats b { font-size: 26px; font-family: var(--font-display); color: var(--accent-strong); }
.done-stats span { color: var(--mut); font-size: 12.5px; font-weight: 600; letter-spacing: .03em; }
.goal-note { margin-top: 18px; font-weight: 700; color: var(--flame); }
.goal-note.dim { color: var(--mut); font-weight: 600; }

/* review */
.flash { text-align: center; padding-top: 40px; padding-bottom: 36px; }
.flash .prompt { margin-top: 8px; }
.flash-back {
  margin: 22px auto 0; padding-top: 20px; border-top: 1.6px dashed var(--line);
  font-size: 17px; line-height: 1.6; max-width: 480px;
  animation: rise .3s both;
}
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; width: 100%; max-width: 620px; }
.grade {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 11px 6px; border-radius: 14px; border: 1.6px solid var(--line); background: var(--surface);
  transition: transform .12s, border-color .12s;
}
.grade:hover { transform: translateY(-2px); }
.grade b { font-size: 14.5px; }
.grade span { font-size: 11.5px; color: var(--mut); font-weight: 600; }
.grade.g0:hover { border-color: var(--bad); } .grade.g0 b { color: var(--bad); }
.grade.g1:hover { border-color: var(--gold); } .grade.g1 b { color: var(--gold); }
.grade.g2:hover { border-color: var(--good); } .grade.g2 b { color: var(--good); }
.grade.g3:hover { border-color: var(--accent); } .grade.g3 b { color: var(--accent-strong); }

.empty { text-align: center; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty svg { width: 200px; margin-bottom: 8px; }
.empty h2 { font-size: 26px; }
.empty p { color: var(--mut); margin-bottom: 18px; }

/* ---------------- stats ---------------- */

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 860px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow);
}
.panel-label { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; }
.panel .big { font-size: 24px; font-family: var(--font-display); display: block; }
.panel small { color: var(--mut); font-size: 12.5px; }

.heat { display: flex; gap: 5px; justify-content: space-between; }
.heat-col { display: flex; flex-direction: column; gap: 5px; flex: 1; }
.heat i {
  display: block; aspect-ratio: 1; border-radius: 5px; background: var(--surface-2);
  border: 1px solid var(--line);
}
.heat i.l1 { background: hsl(var(--ah) 70% 55% / .3); border-color: transparent; }
.heat i.l2 { background: hsl(var(--ah) 70% 55% / .6); border-color: transparent; }
.heat i.l3 { background: var(--accent); border-color: transparent; }
.heat i.future { opacity: .28; }

.course-bars { display: flex; flex-direction: column; gap: 9px; }
.course-bar {
  display: grid; grid-template-columns: 220px 1fr 48px; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 18px; box-shadow: var(--shadow); font-weight: 600; font-size: 14.5px;
}
.course-bar small { color: var(--mut); text-align: right; }
.course-bar:hover { border-color: var(--accent-line); }
@media (max-width: 620px) { .course-bar { grid-template-columns: 1fr 60px; } .course-bar .bar { display: none; } }

/* ---------------- modal / settings ---------------- */

.modal-wrap {
  position: fixed; inset: 0; background: #0a091277; backdrop-filter: blur(5px);
  display: flex; justify-content: center; z-index: 60; padding: 20px; overflow-y: auto;
}
.modal {
  margin: auto 0;
  align-self: safe center;
  width: 100%; max-width: 400px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lift);
  padding: 26px; animation: card-in .25s both;
}
.modal h2 { font-size: 23px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 13px; font-weight: 700; color: var(--mut); }
.field input, .field select {
  font: 500 15px var(--font-ui); color: var(--ink);
  background: var(--surface-2); border: 1.4px solid var(--line); border-radius: 11px;
  padding: 10px 12px; outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.modal-row { display: flex; gap: 10px; margin-top: 6px; }
.modal-row .btn { flex: 1; padding: 11px 0; }
.danger-link { display: block; margin: 18px auto 0; color: var(--bad); font-size: 13.5px; font-weight: 600; }
.danger-link:hover { text-decoration: underline; }

/* ---------------- effects ---------------- */

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; }
.xp-float {
  position: fixed; z-index: 70; transform: translate(-50%, 0);
  font-weight: 800; font-size: 14px; color: var(--gold);
  text-shadow: 0 1px 0 var(--bg);
  animation: float-up 1.3s cubic-bezier(.2,.7,.3,1) both;
  pointer-events: none;
}
@keyframes float-up { from { opacity: 0; translate: 0 8px; } 25% { opacity: 1; } to { opacity: 0; translate: 0 -44px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------------- toasts ---------------- */

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; z-index: 90;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow-lift); padding: 12px 18px; max-width: min(420px, 90vw);
  font-size: 13.5px; line-height: 1.4; animation: toast-in .35s cubic-bezier(.2,.9,.3,1.2) both;
}
.toast b { font-size: 14.5px; }
.toast.bye { animation: toast-out .3s both; }
.toast-art { flex: 0 0 54px; }
.toast-art svg { width: 100%; height: auto; }
.toast-emoji { font-size: 26px; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toast-out { to { opacity: 0; transform: translate(-50%, 10px); } }

/* ---------------- search ---------------- */

.search-in {
  width: 100%; margin: 16px 0 18px;
  font: 500 17px var(--font-ui); color: var(--ink);
  background: var(--surface); border: 1.6px solid var(--line); border-radius: 16px;
  padding: 14px 18px; outline: none; box-shadow: var(--shadow);
}
.search-in:focus { border-color: var(--accent); }
.search-out { display: flex; flex-direction: column; gap: 10px; }
.search-hint { color: var(--mut); text-align: center; padding: 28px 0; }
.search-hit {
  display: flex; flex-direction: column; gap: 3px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
  padding: 13px 17px; box-shadow: var(--shadow);
  transition: transform .14s, border-color .14s;
}
.search-hit:hover { transform: translateX(3px); border-color: var(--accent-line); }
.hit-course { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-strong); }
.search-hit b { font-size: 16px; }
.search-hit p { color: var(--mut); font-size: 13.5px; }
.search-hit mark { background: var(--accent-soft); color: var(--accent-strong); border-radius: 3px; padding: 0 2px; }

/* ---------------- completion misses ---------------- */

.misses { margin-top: 18px; text-align: left; border-top: 1.4px dashed var(--line); padding-top: 14px; }
.misses summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--mut); }
.misses summary:hover { color: var(--ink); }
.miss { margin-top: 12px; }
.miss-q { font-weight: 600; font-size: 14px; }
.miss-a { font-size: 13.5px; color: var(--mut); margin-top: 2px; }
.miss-a b { color: var(--good); }

/* ---------------- review forecast ---------------- */

.forecast { display: flex; gap: 8px; align-items: stretch; }
.fc-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.fc-n { font-size: 12px; font-weight: 700; color: var(--accent-strong); min-height: 16px; font-variant-numeric: tabular-nums; }
.fc-bar { width: 100%; max-width: 42px; height: 74px; background: var(--surface-2); border-radius: 9px; display: flex; align-items: flex-end; overflow: hidden; }
.fc-bar i { display: block; width: 100%; background: var(--accent); border-radius: 9px 9px 0 0; min-height: 0; transition: height .5s cubic-bezier(.3,.7,.3,1); }
.fc-d { font-size: 11.5px; font-weight: 600; color: var(--mut); }
.tricky { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.tricky-row { font-size: 14px; margin-top: 7px; }
.tricky-row small { color: var(--bad); font-weight: 700; margin-left: 6px; }

/* ---------------- achievements ---------------- */

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge-card {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 10px 12px; box-shadow: var(--shadow);
  opacity: .38; filter: saturate(.2);
}
.badge-card.earned { opacity: 1; filter: none; border-color: var(--accent-line); }
.badge-art { width: 74px; }
.badge-art svg { width: 100%; height: auto; }
.badge-card b { font-size: 13.5px; }
.badge-card small { color: var(--mut); font-size: 11.5px; line-height: 1.35; }

/* ---------------- backup ---------------- */

.backup { margin-top: 16px; font-size: 13px; }
.backup summary { cursor: pointer; font-weight: 700; color: var(--mut); }
.backup summary:hover { color: var(--ink); }
.backup-note { color: var(--mut); margin: 8px 0; }
.backup .modal-row { margin-top: 0; }
.backup-text {
  width: 100%; margin-top: 10px; font: 12px ui-monospace, monospace; color: var(--ink);
  background: var(--surface-2); border: 1.4px solid var(--line); border-radius: 10px; padding: 8px;
}

/* ---------------- touch & mobile ergonomics ---------------- */

button, .choice, .grade, .btn, .iconbtn, .chip, .cover, .lesson-row, .action-card, .search-hit {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button, .btn, .choice, .grade { user-select: none; -webkit-user-select: none; }

/* notched phones: keep chrome out of the sensor housing / home bar */
.topbar { padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
.page { padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
.player {
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
  padding-top: max(18px, env(safe-area-inset-top));
  padding-bottom: max(30px, env(safe-area-inset-bottom));
}

@media (max-width: 480px) {
  .chip { padding: 6px 9px; font-size: 12px; gap: 4px; }
  .topbar-right { gap: 6px; }
  .brand { font-size: 19px; }
  .done-stats { gap: 22px; }
  .done-stats b { font-size: 22px; }
  .grades { gap: 6px; }
  .grade { padding: 10px 2px; }
  .grade b { font-size: 13px; }
  .card-art { width: 150px; }
  .done-card .card-art { width: 160px; }
  .player-top { gap: 10px; }
  .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel { padding: 14px 16px; }
  .panel .big { font-size: 20px; }
  .badges { grid-template-columns: repeat(2, 1fr); }
  .fc-bar { height: 58px; }
  .choices.tf { flex-direction: column; }          /* stacked True/False beats cramped halves */
  .btn { padding: 13px 26px; }
  .cover-meta span { font-size: 11.5px; }
}

/* ---------------- practice & match ---------------- */

.btn.small { padding: 9px 18px; font-size: 13.5px; margin-top: 12px; align-self: flex-start; }

.match-card { padding: 22px 18px; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  text-align: left; font-size: 13px; line-height: 1.4; font-weight: 600;
  padding: 11px 12px; border-radius: 13px; flex: 1;
  background: var(--surface-2); border: 1.6px solid var(--line);
  transition: border-color .13s, background .13s, opacity .2s, transform .1s;
}
.match-tile.back { font-weight: 500; }
.match-tile:not(:disabled):hover { border-color: var(--accent-line); }
.match-tile.sel { border-color: var(--accent); background: var(--accent-soft); }
.match-tile.locked { opacity: .45; border-color: var(--good); background: var(--good-soft); }
.match-tile.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
@media (max-width: 480px) { .match-tile { font-size: 12px; padding: 9px 10px; } }

/* ---------------- XP history ---------------- */

.spark { display: flex; align-items: flex-end; gap: 3px; height: 88px; }
.spark i { flex: 1; background: var(--line); border-radius: 3px 3px 0 0; min-width: 3px; }
.spark i.met { background: var(--accent); }
.spark-note { display: block; margin-top: 9px; color: var(--mut); font-size: 12px; }

/* ---------------- tour ---------------- */

.tour-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.tour-art { flex: 0 0 64px; }
.tour-art svg { width: 100%; height: auto; }
.tour-row p { font-size: 13.5px; line-height: 1.5; color: var(--mut); font-weight: 500; }
.tour-row b { color: var(--ink); }

.version { margin-top: 16px; text-align: center; color: var(--mut); font-size: 11.5px; }

/* Prism — sound effects. Tiny WebAudio synth, no assets. Honors settings.sound. */
(function () {
  'use strict';

  var ctx = null;

  function ac() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }

  function enabled() {
    try { return window.Store && Store.state.settings.sound !== false; } catch (e) { return false; }
  }

  /* one enveloped oscillator note; t offset (s), f frequency, d duration, g peak gain */
  function note(c, f, t, d, type, g) {
    var o = c.createOscillator(), v = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = f;
    var t0 = c.currentTime + t;
    v.gain.setValueAtTime(0.0001, t0);
    v.gain.exponentialRampToValueAtTime(g || 0.08, t0 + 0.012);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(v); v.connect(c.destination);
    o.start(t0); o.stop(t0 + d + 0.02);
  }

  function play(fn) {
    if (!enabled()) return;
    var c = ac();
    if (c) { try { fn(c); } catch (e) { /* audio unavailable */ } }
  }

  window.SFX = {
    correct: function () { play(function (c) { note(c, 587.3, 0, 0.12); note(c, 880, 0.09, 0.18, 'sine', 0.07); }); },
    wrong: function () { play(function (c) { note(c, 220, 0, 0.16, 'triangle', 0.06); note(c, 174.6, 0.1, 0.22, 'triangle', 0.05); }); },
    flip: function () { play(function (c) { note(c, 660, 0, 0.07, 'sine', 0.045); }); },
    grade: function () { play(function (c) { note(c, 520, 0, 0.06, 'sine', 0.04); }); },
    complete: function () {

        note(c, 659.25, 0.11, 0.16, 'sine', 0.07);

<script>
/* Prism — spaced repetition scheduler (SM-2 derived).
   Grades: 0 = Again, 1 = Hard, 2 = Good, 3 = Easy. */
(function () {
  'use strict';

  var MIN_EASE = 1.3;
  var START_EASE = 2.5;
  var MAX_IVL_DAYS = 365;
  var MIN_MS = 60 * 1000;
  var DAY_MS = 24 * 60 * 60 * 1000;

  function newItem(id, courseId, lessonId, front, back, now) {
    return {
      id: id, courseId: courseId, lessonId: lessonId,
      front: front, back: back,
      state: 'new',            // new | learning | review
      step: 0,
      ease: START_EASE,
      ivl: 0,                  // days, meaningful in review state
      due: now,
      reps: 0, lapses: 0,
      addedAt: now
    };
  }

  function clampIvl(d) { return Math.max(1, Math.min(MAX_IVL_DAYS, Math.round(d))); }

  function grade(item, g, now) {
    item.reps += 1;
    if (item.state === 'review') {
      if (g === 0) {
        item.lapses += 1;
        item.ease = Math.max(MIN_EASE, item.ease - 0.2);
        item.state = 'learning';
        item.step = 0;
        item.ivl = clampIvl(item.ivl * 0.5);
        item.due = now + 10 * MIN_MS;
      } else if (g === 1) {
        item.ease = Math.max(MIN_EASE, item.ease - 0.15);
        item.ivl = clampIvl(Math.max(item.ivl + 1, item.ivl * 1.2));
        item.due = now + item.ivl * DAY_MS;
      } else if (g === 2) {
        item.ivl = clampIvl(item.ivl * item.ease);
        item.due = now + item.ivl * DAY_MS;
      } else {
        item.ease += 0.15;
        item.ivl = clampIvl(item.ivl * item.ease * 1.35);
        item.due = now + item.ivl * DAY_MS;
      }
    } else { // new or learning
      item.state = 'learning';
      if (g === 0) {
        item.step = 0;
        item.due = now + 10 * MIN_MS;
      } else if (g === 1) {
        item.due = now + 30 * MIN_MS;
      } else if (g === 2) {
        if (item.step >= 1) {
          item.state = 'review';
          item.ivl = Math.max(1, item.ivl);   // a lapsed card keeps its halved interval
          item.due = now + item.ivl * DAY_MS;
        } else {
          item.step = 1;
          item.due = now + 60 * MIN_MS;
        }
      } else {
        item.state = 'review';
        item.ivl = Math.max(3, item.ivl);
        item.due = now + item.ivl * DAY_MS;
      }
    }
    return item;
  }

  function fmtIvl(ms) {
    if (ms < 60 * MIN_MS) return Math.round(ms / MIN_MS) + 'm';
    if (ms < DAY_MS) return Math.round(ms / (60 * MIN_MS)) + 'h';
    var d = Math.round(ms / DAY_MS);
    if (d < 30) return d + 'd';
    if (d < 365) return Math.round(d / 30.4) + 'mo';
    return Math.round(d / 365) + 'y';
  }

  /* Labels shown on the four grade buttons for a given item. */
  function previewIntervals(item) {
    if (item.state === 'review') {
      var hardIvl = clampIvl(Math.max(item.ivl + 1, item.ivl * 1.2));
      var goodIvl = clampIvl(item.ivl * item.ease);
      var easyIvl = clampIvl(item.ivl * (item.ease + 0.15) * 1.35);
      return ['10m', fmtIvl(hardIvl * DAY_MS), fmtIvl(goodIvl * DAY_MS), fmtIvl(easyIvl * DAY_MS)];
    }
    var good = item.step >= 1 ? fmtIvl(Math.max(1, item.ivl) * DAY_MS) : '1h';
    return ['10m', '30m', good, fmtIvl(Math.max(3, item.ivl) * DAY_MS)];
  }

  function dueItems(items, now) {
    var out = [];
    for (var k in items) if (items[k].due <= now) out.push(items[k]);
    out.sort(function (a, b) { return a.due - b.due; });
    return out;
  }

  function nextDue(items) {
    var t = null;
    for (var k in items) {
      if (t === null || items[k].due < t) t = items[k].due;
    }
    return t;
  }

  window.SRS = {
    newItem: newItem, grade: grade, previewIntervals: previewIntervals,
    dueItems: dueItems, nextDue: nextDue, fmtIvl: fmtIvl
  };
})();

</script>
<script>
/* Prism — app state, persistence, XP / streak / progress accounting. */
(function () {
  'use strict';

  var KEY = 'prism.v1';
  var DAY_MS = 24 * 60 * 60 * 1000;

  var defaults = function () {
    return {
      xp: 0,
      xpByDay: {},            // 'YYYY-MM-DD' -> xp earned that day
      goalDays: {},           // 'YYYY-MM-DD' -> true once that day's goal was met
      lessons: {},            // courseId -> lessonId -> {completedAt, best (0-100), runs}
      srs: {},                // itemId -> SRS item
      reviewsByDay: {},       // 'YYYY-MM-DD' -> cards reviewed
      lastLesson: null,       // {courseId, lessonId}
      inProgress: {},         // 'courseId/lessonId' -> mid-lesson snapshot
      toured: false,          // first-visit tour dismissed
      badges: {},             // badgeId -> earnedAt timestamp
      settings: { theme: 'system', dailyGoal: 50, name: '', sound: true },
      firstSeen: Date.now()
    };
  };

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        var d = defaults();
        for (var k in d) if (!(k in s)) s[k] = d[k];
        for (var k2 in d.settings) if (!(k2 in s.settings)) s.settings[k2] = d.settings[k2];
        if (!s.settings.theme) s.settings.theme = 'system';
        if (!s.settings.dailyGoal) s.settings.dailyGoal = 50;
        return s;
      }
    } catch (e) { /* storage unavailable or corrupt — run in-memory */ }
    return defaults();
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* in-memory only */ }
  }

  function dayKey(t) {
    var d = new Date(t || Date.now());
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  function addXP(n) {
    state.xp += n;
    var k = dayKey();
    state.xpByDay[k] = (state.xpByDay[k] || 0) + n;
    // freeze goal completion at the goal in force that day, so changing the
    // daily goal later never rewrites streak history
    if (state.xpByDay[k] >= state.settings.dailyGoal) state.goalDays[k] = true;
    save();
    return n;
  }

  function todayXP() { return state.xpByDay[dayKey()] || 0; }

  function goalMet(k) {
    return state.goalDays[k] === true || (state.xpByDay[k] || 0) >= state.settings.dailyGoal;
  }

  /* Consecutive days (ending today or yesterday) with the daily goal met.
     Walks calendar days, not fixed 24h steps, so DST transitions don't skip. */
  function streak() {
    var n = 0;
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (!goalMet(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
    while (goalMet(dayKey(d.getTime()))) { n += 1; d.setDate(d.getDate() - 1); }
    return n;
  }

  function streakIncludesToday() { return goalMet(dayKey()); }

  var LEVELS = ['Newcomer', 'Learner', 'Explorer', 'Scholar', 'Thinker', 'Adept', 'Sage', 'Polymath', 'Luminary', 'Prismatic'];
  function level() {
    var lvl = Math.floor(Math.sqrt(state.xp / 60));
    var title = LEVELS[Math.min(lvl, LEVELS.length - 1)];
    var floorXP = lvl * lvl * 60;
    var nextXP = (lvl + 1) * (lvl + 1) * 60;
    return { n: lvl + 1, title: title, into: state.xp - floorXP, span: nextXP - floorXP };
  }

  function lessonRecord(cid, lid) {
    return (state.lessons[cid] || {})[lid] || null;
  }

  function completeLesson(cid, lid, accuracy) {
    if (!state.lessons[cid]) state.lessons[cid] = {};
    var rec = state.lessons[cid][lid];
    if (!rec) rec = state.lessons[cid][lid] = { completedAt: Date.now(), best: 0, runs: 0 };
    rec.runs += 1;
    rec.completedAt = Date.now();
    rec.best = Math.max(rec.best, accuracy);
    save();
    return rec;
  }

  function courseProgress(course) {
    var done = 0;
    for (var i = 0; i < course.lessons.length; i++) {
      if (lessonRecord(course.id, course.lessons[i].id)) done += 1;
    }
    return { done: done, total: course.lessons.length };
  }

  function addReviewItems(course, lesson) {
    var added = 0;
    var now = Date.now();
    for (var i = 0; i < lesson.review.length; i++) {
      var id = course.id + '/' + lesson.id + '/' + i;
      if (!state.srs[id]) {
        state.srs[id] = SRS.newItem(id, course.id, lesson.id, lesson.review[i].front, lesson.review[i].back, now);
        added += 1;
      }
    }
    save();
    return added;
  }

  function gradeReview(item, g) {
    SRS.grade(item, g, Date.now());
    var k = dayKey();
    state.reviewsByDay[k] = (state.reviewsByDay[k] || 0) + 1;
    save();
  }

  function srsCount() { var n = 0; for (var k in state.srs) n += 1; return n; }

  function totalReviews() { var n = 0; for (var k in state.reviewsByDay) n += state.reviewsByDay[k]; return n; }

  function exportData() { return JSON.stringify(state); }

  /* Replace state with a backup blob. Returns error string or null on success. */
  function importData(str) {
    var s;
    try { s = JSON.parse(str); } catch (e) { return 'That doesn’t look like valid backup text.'; }
    if (!s || typeof s !== 'object' || typeof s.xp !== 'number' || !s.settings || !s.xpByDay) {
      return 'That text isn’t a Prism backup — copy one from Settings on the device you’re importing from.';
    }
    var d = defaults();
    for (var k in d) if (!(k in s)) s[k] = d[k];
    for (var k2 in d.settings) if (!(k2 in s.settings)) s.settings[k2] = d.settings[k2];
    state = s;
    save();
    return null;
  }

  function setLastLesson(cid, lid) { state.lastLesson = { courseId: cid, lessonId: lid }; save(); }

  function saveProgress(cid, lid, snap) { state.inProgress[cid + '/' + lid] = snap; save(); }

  /* Mid-lesson snapshots expire after a week — stale resumes confuse more than help. */
  function getProgress(cid, lid) {
    var p = state.inProgress[cid + '/' + lid];
    if (!p) return null;
    if (Date.now() - p.savedAt > 7 * 24 * 60 * 60 * 1000) { clearProgress(cid, lid); return null; }
    return p;
  }

  function clearProgress(cid, lid) { delete state.inProgress[cid + '/' + lid]; save(); }

  /* Newest unexpired snapshot, or null. */
  function newestProgress() {
    var best = null, bestKey = null;
    for (var k in state.inProgress) {
      var p = state.inProgress[k];
      if (Date.now() - p.savedAt > 7 * 24 * 60 * 60 * 1000) continue;
      if (!best || p.savedAt > best.savedAt) { best = p; bestKey = k; }
    }
    if (!best) return null;
    var parts = bestKey.split('/');
    return { courseId: parts[0], lessonId: parts[1], snap: best };
  }

  function markToured() { state.toured = true; save(); }

  function setSetting(k, v) { state.settings[k] = v; save(); }

  function resetAll() { state = defaults(); save(); }

  window.Store = {
    get state() { return state; },
    save: save, addXP: addXP, todayXP: todayXP, streak: streak, goalMet: goalMet,
    streakIncludesToday: streakIncludesToday, level: level, dayKey: dayKey,
    lessonRecord: lessonRecord, completeLesson: completeLesson, courseProgress: courseProgress,
    addReviewItems: addReviewItems, gradeReview: gradeReview, srsCount: srsCount,
    totalReviews: totalReviews, exportData: exportData, importData: importData,
    saveProgress: saveProgress, getProgress: getProgress, clearProgress: clearProgress,
    newestProgress: newestProgress, markToured: markToured,
    setLastLesson: setLastLesson, setSetting: setSetting, resetAll: resetAll
  };
})();

</script>

            "prompt": "'If we ban one book from the school library, soon we'll ban hundreds.' What single question turns this from rhetoric into analysis?",
            "answer": "'By what mechanism?' Demand the specific links — precedent, incentives, shifting norms — and how likely each one is. A slope claim without a mechanism is a fear with momentum."
          },
          {
            "type": "concept",
            "title": "The Middle Isn't Sacred Either",
            "body": "Escaping a false dilemma doesn't mean splitting the difference. The argument-to-moderation fallacy assumes truth sits midway between any two positions. If one person says 2+2=4 and another insists it's 6, the answer isn't 5. Sometimes an 'extreme' is simply correct; the middle earns nothing by geography.",

          },
          {
            "type": "mcq",

            "answer": 1,
            "explain": "A slope argument is exactly as strong as its chain. Outcomes from comparable places turn a scare story into a forecast you can check."

          {
            "type": "example",
            "title": "The Salesman's Either/Or",
            "body": "Sales trainers teach the 'alternative close': 'Shall we deliver Tuesday or Thursday?' The purchase is presupposed; only details remain on the menu. Political framing runs the same play — 'tough on crime or soft on crime?' skips every option in between. Whoever writes the menu usually wins the meal.",

            "title": "Count the Doors",

              "Slippery slopes need mechanisms (precedent, incentives), not just momentum.",
              "Long causal chains multiply probabilities; every link under 100% thins the whole.",
              "Don't overcorrect: the middle position isn't right by geography."

        ],
        "review": [
          {
            "front": "What is a false dilemma?",
            "back": "Presenting two options as the only possibilities when others exist — a dial disguised as a switch."
          },
          {
            "front": "When is an either/or framing legitimate?",
            "back": "When the options are logically exhaustive, like 'A or not-A' — they must cover every possible case."

          {
            "front": "What separates a fallacious slippery slope from a reasonable one?",

      },
      {
        "id": "appeals",
        "title": "Borrowed Credibility",
        "summary": "When borrowed credibility — experts, feelings, crowds, nature, tradition — counts as evidence, and when it's a costume.",
        "cards": [
          {
            "type": "intro",
            "title": "More Doctors Smoke Camels",
            "body": "'More doctors smoke Camels than any other cigarette,' claimed a 1946 ad campaign, complete with white-coated physicians. Authority, popularity, and reassurance in a single image — and wrong about the only thing that mattered. Appeals persuade by borrowing credibility. Your job is to audit the loan.",
            "art": "bell"
          },
          {
            "type": "concept",
            "title": "Renting Credibility",
            "body": "Deferring to experts isn't a fallacy — it's how finite brains navigate a vast world. Appeals to authority go wrong three ways: the expertise is in a different field, the experts genuinely disagree, or the 'authority' is just fame, wealth, or a lab coat. Legitimate appeals cite relevant, current, consensus-backed expertise.",
            "art": "coin"
          },
          {
            "type": "example",
            "title": "The Nobel Disease",
            "body": "Linus Pauling won the 1954 Nobel Prize in Chemistry — then spent decades promoting vitamin C megadoses for colds and cancer, claims controlled trials repeatedly failed to support. Skeptics coined 'Nobel disease' for laureates who roam confidently outside their field. Expertise is narrow. Check that it covers the claim at hand.",
            "art": "brain"
          },
          {
            "type": "truefalse",
            "statement": "Citing the CDC on vaccine safety and citing a famous actor on vaccine safety are both appeals to authority, so they're equally weak.",
            "answer": false,
            "explain": "Relevant, accountable, consensus-backed expertise is genuine evidence; fame is not. The fallacy is appealing to authority that isn't authoritative on the question."
          },
          {
            "type": "concept",
            "title": "Feelings as Evidence",
            "body": "Appeals to emotion — pity, fear, outrage — swap reasons for reactions. Emotion itself isn't the enemy; a true story can be moving and probative at once. The fallacy is when feeling does the work facts can't: the ad selling alarm instead of data, the plea answering 'is it true?' with 'but it's sad.'",
            "art": "wave"
          },
          {
            "type": "example",
            "title": "The Daisy Ad",
            "body": "September 1964: a little girl counts daisy petals, the count morphs into a missile countdown, a mushroom cloud blooms. Lyndon Johnson's 'Daisy' ad aired just once and never named Barry Goldwater — no argument, only dread and a voting reminder. It's still studied because it worked. Fear skips the step where claims get defended.",
            "art": "clock"
          },
          {
            "type": "mcq",
            "prompt": "A charity mailer shows a suffering child and asks for donations. When does this become an appeal-to-emotion fallacy?",
            "choices": [
              "Never — charities are allowed to be moving",
              "Always — arguments should be emotionless",
              "When the feeling substitutes for the factual case, like whether donations actually help",
              "Only if the photograph is staged"

            "answer": 2,
            "explain": "Emotion pointed at true, relevant facts is honest persuasion. It turns fallacious when the tug replaces the question you should be asking."

          {
            "type": "concept",
            "title": "Fifty Million Frenchmen",
            "body": "Argumentum ad populum: it must be true, because everyone believes it. But majorities once backed geocentrism and leaded gasoline. Popularity tracks marketing, habit, and conformity at least as well as truth — fifty million Frenchmen can, in fact, be wrong. What crowds echo is often just each other.",
            "art": "network"
          },
          {
            "type": "quote",
            "text": "The fact that an opinion has been widely held is no evidence whatever that it is not utterly absurd.",
            "by": "Bertrand Russell"
          },
          {
            "type": "reveal",
            "prompt": "In 1906, Francis Galton collected 787 guesses of an ox's weight at an English livestock fair. How did the crowd do?",

          {
            "type": "concept",
            "title": "Natural and Ancient",
            "body": "The appeal to nature says natural equals good — but arsenic, botulinum toxin, and smallpox are perfectly natural, while insulin and eyeglasses are not. The appeal to tradition says old equals right — yet 'we've always done it' defended bloodletting for two millennia. Age and naturalness describe a practice; they don't defend it.",
            "art": "seed"
          },
          {
            "type": "mcq",
            "prompt": "'People have eaten this way for centuries' and 'it's 100% natural' both fail as arguments for the same core reason. What is it?",
            "choices": [
              "They cite properties — age, naturalness — that don't track truth or safety",
              "They're appeals to authority in disguise",
              "They're statistically unrepresentative",

            "answer": 0,
            "explain": "Both substitute a comfortable attribute for evidence. Arsenic is natural and bloodletting was traditional; the attribute settles nothing either way."
          },
          {
            "type": "recap",
            "title": "Audit the Loan",
            "points": [
              "Deferring to experts is rational when expertise is relevant, current, and consensus-backed.",

              "'Natural' and 'traditional' are descriptions, not arguments."
            ]
          }
        ],
        "review": [
          {
            "front": "When is citing an authority legitimate?",
            "back": "When the source has relevant expertise, the claim falls inside that expertise, and experts in the field broadly agree."
          },
          {
            "front": "What is argumentum ad populum?",
            "back": "Arguing a claim is true because many believe it. Majorities once backed geocentrism and leaded gasoline."
          },
          {
            "front": "What is the appeal to nature?",
            "back": "Assuming natural means good and artificial means bad. Arsenic is natural; insulin is synthetic."
          },
          {
            "front": "When does emotional persuasion become fallacious?",
            "back": "When the emotion substitutes for evidence — answering 'is it true?' with 'but it's sad' or 'but it's scary.'"
          }
        ]
      },
      {
        "id": "causal-burden-of-proof",
        "title": "The Painted Bullseye",
        "summary": "Untangle sequence from cause, catch bullseyes painted after the fact, and keep the burden of proof where it belongs.",
        "cards": [
          {
            "type": "intro",
            "title": "Nicolas Cage Causes Drownings",
            "body": "From 1999 to 2009, US pool drownings tracked the number of films Nicolas Cage appeared in each year — a correlation Tyler Vigen made famous on his Spurious Correlations site. Nobody blames Cage. But swap in 'screen time' and 'teen depression' and the same graph shape suddenly feels like proof. This lesson is about that feeling.",
            "art": "graph"
          },
          {
            "type": "concept",
            "title": "After, Therefore Because",
            "body": "Post hoc ergo propter hoc — 'after this, therefore because of this.' The rooster crows; the sun rises. You took the remedy Tuesday and felt better Thursday. Sequence feels like causation because causes do come first — but so does everything else that happened earlier. Timing is a clue, never a verdict.",
            "art": "clock"
          },
          {
            "type": "truefalse",
            "statement": "Most colds clear up within about a week on their own — which makes 'I took zinc and got better' weak evidence that zinc works.",
            "answer": true,
            "explain": "Self-limiting illnesses improve regardless, so nearly any remedy looks effective post hoc. Control groups exist to show what would have happened anyway."
          },
          {
            "type": "concept",
            "title": "Four Suspects Behind Every Correlation",
            "body": "When A and B move together, interrogate four suspects: A causes B, B causes A, some third thing C drives both, or chance made the match. Ice cream sales correlate with drownings; the culprit is summer. Randomized experiments exist precisely to isolate the first suspect. Without one, hold your verdict loosely.",
            "art": "network"
          },
          {
            "type": "mcq",
            "prompt": "Cities that send more firefighters to a blaze end up with more fire damage. Best explanation?",
            "choices": [
              "Firefighters cause the damage",
              "Bigger fires summon more firefighters and cause more damage — a third factor drives both",
              "Pure coincidence",
              "The data must be fake"
            ],
            "answer": 1,
            "explain": "Fire size is the classic confounder: it pulls in more crews and burns more property. Third variables and reverse causation explain most eerie correlations."
          },
          {
            "type": "concept",
            "title": "The Texas Sharpshooter",
            "body": "A Texan sprays a barn with bullets, then paints a bullseye around the tightest cluster. The Texas sharpshooter fallacy does this with data: test enough patterns and some cluster will look deliberate. Many cancer-cluster scares and hot-streak stock pickers are paint, applied after the shooting.",
            "art": "target"
          },
          {
            "type": "reveal",
            "prompt": "A stock-tips newsletter has called the market right six months straight. Before subscribing, what are you not seeing?",
            "answer": "The other newsletters. Mail 64 people every combination of up/down predictions and one recipient sees six perfect calls. Survivorship bias plus the sharpshooter: you see the bullseye, never the sprayed barn."
          },
          {
            "type": "concept",
            "title": "The Motte and the Bailey",
            "body": "Philosopher Nicholas Shackel named this one in 2005, after medieval castles: advance a bold claim (the fertile bailey), and when attacked, retreat to a modest one (the fortified motte) — 'all I'm saying is...' — then creep back out once pressure fades. The tell: the claim defended is not the claim advanced.",

          },
          {
            "type": "example",
            "title": "All I'm Saying Is...",
            "body": "In the wild: 'This cleanse detoxifies your body' shrinks, under questioning, to 'I just mean vegetables are healthy' — then the product page resumes selling detox. Counter it by naming both claims: 'The modest version is true but trivial. The bold version is the one that needs defending. Which are you making?'",

          },
          {
            "type": "concept",
            "title": "Who Has to Prove What",
            "body": "The burden of proof rests on whoever asserts — and grows with the assertion's surprise. Bertrand Russell's 1952 teapot: nobody can disprove a tiny teapot orbiting the sun, yet that's no reason to believe in one. 'Prove me wrong' quietly swaps the rules; unfalsifiable is not the same as true.",

          },
          {
            "type": "quote",
            "text": "What can be asserted without evidence can also be dismissed without evidence.",
            "by": "Christopher Hitchens"
          },
          {
            "type": "mcq",
            "prompt": "'You can't prove ghosts don't exist, so believing in them is reasonable.' What's the flaw?",
            "choices": [
              "It shifts the burden of proof onto the doubter",
              "It's an ad hominem attack",
              "It's a post hoc fallacy",
              "None — absence of disproof is support"
            ],
            "answer": 0,
            "explain": "The asserter owes the evidence, and 'undisprovable' isn't 'supported.' By Hitchens's razor, what's asserted without evidence can be dismissed without it."
          },
          {
            "type": "recap",
            "title": "Demand the Mechanism",
            "points": [
              "Post hoc: 'after' isn't 'because' — everything has something before it.",
              "Every correlation has four suspects: A causes B, B causes A, a hidden C, or chance.",
              "Sharpshooter: patterns found after the fact need fresh data to count.",
              "Motte-and-bailey: make sure the claim defended is the claim advanced.",
              "The burden of proof rides with the asserter; unfalsifiable isn't true."
            ]
          }
        ],
        "review": [
          {
            "front": "What is post hoc ergo propter hoc?",
            "back": "Assuming that because B followed A, A caused B. Sequence is a clue, not proof — the rooster doesn't raise the sun."
          },
          {
            "front": "Name the four explanations for any correlation between A and B.",
            "back": "A causes B, B causes A, a third factor drives both, or chance."
          },
          {
            "front": "What is the motte-and-bailey tactic?",
            "back": "Advancing a bold claim, retreating to a modest defensible one when challenged, then creeping back to the bold one."
          },
          {
            "front": "What is Hitchens's razor?",
            "back": "What can be asserted without evidence can be dismissed without evidence — the burden of proof sits with the asserter."

</script>
<script>
/* Prism — application: router, views, lesson player, review session, stats. */
(function () {
  'use strict';

  var $app = null;
  var HUES = [262, 205, 160, 25, 340, 48, 190, 300]; // per-course accent hues, by index

  /* ---------------- helpers ---------------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function courseHue(cid) {
    for (var i = 0; i < COURSES.length; i++) if (COURSES[i].id === cid) return HUES[i % HUES.length];
    return HUES[0];
  }

  function findCourse(cid) {
    for (var i = 0; i < COURSES.length; i++) if (COURSES[i].id === cid) return COURSES[i];
    return null;
  }

  function findLesson(course, lid) {
    for (var i = 0; i < course.lessons.length; i++) if (course.lessons[i].id === lid) return { lesson: course.lessons[i], index: i };
    return null;
  }

  function fmtDue(t) {
    var d = t - Date.now();
    if (d <= 0) return 'now';
    var m = Math.round(d / 60000);
    if (m < 60) return 'in ' + m + 'm';
    var h = Math.round(m / 60);
    if (h < 24) return 'in ' + h + 'h';
    return 'in ' + Math.round(h / 24) + 'd';
  }

  function greeting() {
    var h = new Date().getHours();
    var g = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    var name = (Store.state.settings.name || '').trim();
    return g + (name ? ', ' + esc(name) : '');
  }

  function isInteractive(card) { return card.type === 'mcq' || card.type === 'truefalse' || card.type === 'reveal'; }

  function xpFloat(n, anchor) {
    var el = document.createElement('div');
    el.className = 'xp-float';
    el.textContent = '+' + n + ' XP';
    var r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
    if (r) { el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = (r.top - 6) + 'px'; }
    else { el.style.right = '28px'; el.style.bottom = '96px'; }
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1400);
  }

  /* Distinct cover glyph per course (fallback: first lesson's intro art). */
  var COVER_ART = {
    'cognitive-biases': 'lens', 'stoicism': 'shield', 'psychology-of-money': 'coin',
    'learning-how-to-learn': 'brain', 'persuasion': 'dialog', 'logical-fallacies': 'balance'
  };
  function coverArt(c) { return COVER_ART[c.id] || c.lessons[0].cards[0].art || 'lightbulb'; }

  /* ---------------- toasts ---------------- */

  /* Toasts queue instead of clobbering, so a goal/level celebration is never
     destroyed by a toast that arrives in the same tick. */
  var toastQ = [], toastBusy = false;
  function toast(html) { toastQ.push(html); pumpToast(); }
  function pumpToast() {
    if (toastBusy || !toastQ.length) return;
    toastBusy = true;
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = toastQ.shift();
    document.body.appendChild(el);
    setTimeout(function () {
      el.classList.add('bye');
      setTimeout(function () { el.remove(); toastBusy = false; pumpToast(); }, 350);
    }, 2800);
  }

  /* ---------------- XP + achievements ---------------- */

  function badgeCtx() {
    var lessonsDone = 0, coursesDone = 0, perfect = 0;
    for (var i = 0; i < COURSES.length; i++) {
      var p = Store.courseProgress(COURSES[i]);
      lessonsDone += p.done;
      if (p.total && p.done === p.total) coursesDone += 1;
      var recs = Store.state.lessons[COURSES[i].id] || {};
      for (var k in recs) if (recs[k].best === 100) perfect += 1;
    }
    return {
      xp: Store.state.xp, streak: Store.streak(), lessonsDone: lessonsDone,
      coursesDone: coursesDone, totalCourses: COURSES.length,
      reviewsTotal: Store.totalReviews(), perfect: perfect,
      hour: new Date().getHours(), deckSize: Store.srsCount()
    };
  }

  function checkBadges() {
    var fresh = Achieve.check(badgeCtx());
    if (fresh.length) SFX.badge();
    for (var i = 0; i < fresh.length; i++) {
      toast('<span class="toast-art">' + Art.svg(fresh[i].art) + '</span><span><b>' + esc(fresh[i].title) + '</b><br>' + esc(fresh[i].desc) + '</span>');
    }
  }

  /* Award XP with goal-crossing and level-up celebrations, then badge evaluation. */
  function gainXP(n, anchor) {
    var goal = Store.state.settings.dailyGoal;
    var before = Store.todayXP();
    var lvlBefore = Store.level().n;
    Store.addXP(n);
    if (anchor !== undefined) xpFloat(n, anchor);
    if (before < goal && Store.todayXP() >= goal) {
      toast('<span class="toast-emoji">🔥</span><span><b>Daily goal hit</b><br>Streak secured: ' + Store.streak() + ' day' + (Store.streak() === 1 ? '' : 's') + '</span>');
    } else {
      var lvl = Store.level();
      if (lvl.n > lvlBefore) {
        SFX.badge();
        toast('<span class="toast-emoji">⬆️</span><span><b>Level ' + lvl.n + ' — ' + esc(lvl.title) + '</b><br>' + (lvl.span - lvl.into) + ' XP to the next level</span>');
      }
    }
    checkBadges();
  }

  /* ---------------- confetti ---------------- */

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.createElement('canvas');
    cv.className = 'confetti';
    cv.width = innerWidth; cv.height = innerHeight;
    document.body.appendChild(cv);
    var ctx = cv.getContext('2d');
    var parts = [];
    for (var i = 0; i < 140; i++) {
      parts.push({
        x: innerWidth / 2 + (Math.random() - 0.5) * 240,
        y: innerHeight * 0.38,
        vx: (Math.random() - 0.5) * 11,
        vy: -(4 + Math.random() * 9),
        s: 4 + Math.random() * 5,
        h: HUES[i % HUES.length] + Math.random() * 30 - 15,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3
      });
    }
    var t0 = performance.now();
    (function tick(t) {
      var dt = Math.min((t - t0) / 1000, 2.2);
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - dt / 2.1);
        ctx.fillStyle = 'hsl(' + p.h + ' 85% 60%)';
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
        ctx.restore();
      }
      if (dt < 2.15) requestAnimationFrame(tick); else cv.remove();
    })(t0);
  }

  /* ---------------- shared chrome ---------------- */

  function headerHTML() {
    var lvl = Store.level();
    var flameOn = Store.streakIncludesToday();
    return '' +
      '<header class="topbar">' +
        '<a class="brand" href="#/">' +
          '<svg class="brand-mark" viewBox="0 0 32 32"><path d="M16 3L30 27H2z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M16 3v24M16 14l-9.5 13M16 14l9.5 13" stroke="currentColor" stroke-width="1.4" opacity=".55"/></svg>' +
          '<span>Prism</span>' +
        '</a>' +
        '<div class="topbar-right">' +
          '<span class="chip streak' + (flameOn ? ' lit' : '') + '" title="Daily streak — hit your goal to keep it alive">' +
            '<svg viewBox="0 0 24 24"><path d="M12 2c1 4.5 6 6.5 6 12a6 6 0 0 1-12 0c0-3 1.6-4.9 3.2-6.7.3 1.9 1 3 2.1 3.6C10.9 8.5 11 5.2 12 2z" fill="currentColor"/></svg>' +
            Store.streak() + '</span>' +
          '<a class="chip xp" href="#/stats" title="Level ' + lvl.n + ' · ' + esc(lvl.title) + '">' +
            '<svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.5l-5.4 4.6L18.3 22 12 17.8 5.7 22l1.7-7.9L2 9.5l7.4-.6z" fill="currentColor"/></svg>' +
            Store.state.xp + ' XP</a>' +
          '<a class="iconbtn" href="#/search" aria-label="Search" title="Search ( / )">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>' +
          '</a>' +
          '<button class="iconbtn" id="btn-settings" aria-label="Settings" title="Settings">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.5-2-1.5c.06-.4.1-.8.1-1.2z"/></svg>' +
          '</button>' +
        '</div>' +
      '</header>';
  }

  function ringHTML(pct, size, label) {
    var r = 34, c = 2 * Math.PI * r;
    var off = c * (1 - Math.min(1, pct));
    return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 80 80">' +
      '<circle cx="40" cy="40" r="' + r + '" class="ring-bg"/>' +
      '<circle cx="40" cy="40" r="' + r + '" class="ring-fg" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '<text x="40" y="45" text-anchor="middle" class="ring-label">' + label + '</text></svg>';
  }

  /* ---------------- home view ---------------- */

  function renderHome() {
    var goal = Store.state.settings.dailyGoal;
    var today = Store.todayXP();
    var pct = Math.min(1, today / goal);
    var due = SRS.dueItems(Store.state.srs, Date.now());
    var totalItems = Store.srsCount();
    var next = SRS.nextDue(Store.state.srs);

    // continue target: newest mid-lesson snapshot → last lesson's course → first incomplete lesson
    var cont = null, resume = null;
    var np = Store.newestProgress();
    if (np) {
      var npc = findCourse(np.courseId);
      var npl = npc && findLesson(npc, np.lessonId);
      if (npl && !Store.lessonRecord(np.courseId, np.lessonId)) {
        cont = { course: npc, lesson: npl.lesson, index: npl.index };
        resume = { at: np.snap.idx + 1, of: npl.lesson.cards.length };
      }
    }
    var last = Store.state.lastLesson;
    if (!cont && last) {
      var lc = findCourse(last.courseId);
      if (lc) {
        for (var i = 0; i < lc.lessons.length; i++) {
          if (!Store.lessonRecord(lc.id, lc.lessons[i].id)) { cont = { course: lc, lesson: lc.lessons[i], index: i }; break; }
        }
      }
    }
    if (!cont) {
      outer:
      for (var ci = 0; ci < COURSES.length; ci++) {
        var p = Store.courseProgress(COURSES[ci]);
        if (p.done > 0 && p.done < p.total) {
          for (var li = 0; li < COURSES[ci].lessons.length; li++) {
            if (!Store.lessonRecord(COURSES[ci].id, COURSES[ci].lessons[li].id)) {
              cont = { course: COURSES[ci], lesson: COURSES[ci].lessons[li], index: li };
              break outer;
            }
          }
        }
      }
    }

    var fresh = Store.state.xp === 0;
    var goalDone = today >= goal;

    var h = headerHTML() + '<main class="page">';

    h += '<section class="hero">' +
      '<div class="hero-text">' +
        '<h1>' + (fresh ? 'Learn something that sticks.' : greeting() + '.') + '</h1>' +
        '<p class="sub">' + (fresh
          ? 'Visual, bite-sized lessons in psychology, philosophy, money and more — with built-in spaced repetition so you actually remember them.'
          : (goalDone ? 'Daily goal complete — the streak lives another day.' :
             'You’re ' + (goal - today) + ' XP from today’s goal.')) + '</p>' +
      '</div>' +
      '<div class="hero-ring" title="Today’s XP">' + ringHTML(pct, 96, today + '<tspan class="ring-sub"> / ' + goal + '</tspan>') + '</div>' +
    '</section>';

    // action row: review + continue
    h += '<section class="actions">';
    h += '<a class="action-card review-card' + (due.length ? '' : ' calm') + '" href="#/review">' +
      '<div class="action-art">' + Art.svg('orbit') + '</div>' +
      '<div class="action-body"><h3>' + (due.length ? 'Review ' + due.length + ' card' + (due.length === 1 ? '' : 's') : 'Review') + '</h3>' +
      '<p>' + (totalItems === 0 ? 'Finish a lesson to start your review deck.' :
               due.length ? 'Spaced repetition keeps it in long-term memory.' :
               'All caught up' + (next ? ' — next card ' + fmtDue(next) : '') + '.') + '</p></div>' +
      (due.length ? '<span class="badge">' + due.length + '</span>' : '') + '</a>';
    if (practicePool(null).length) {
      h += '<a class="action-card" href="#/practice">' +
        '<div class="action-art">' + Art.svg('target') + '</div>' +
        '<div class="action-body"><h3>Practice</h3>' +
        '<p>Quick-fire quiz remix from everything you’ve learned.</p></div>' +
        '<span class="go">›</span></a>';
    }
    if (cont) {
      h += '<a class="action-card continue-card" style="--ah:' + courseHue(cont.course.id) + '" href="#/lesson/' + esc(cont.course.id) + '/' + esc(cont.lesson.id) + '">' +
        '<div class="action-art accent">' + Art.svg(cont.lesson.cards[0].art || 'lightbulb') + '</div>' +
        '<div class="action-body"><h3>' + (resume ? 'Resume' : 'Continue') + ': ' + esc(cont.lesson.title) + '</h3>' +
        '<p>' + esc(cont.course.title) + ' · Lesson ' + (cont.index + 1) + (resume ? ' · card ' + resume.at + '/' + resume.of : '') + '</p></div>' +
        '<span class="go">›</span></a>';
    }
    h += '</section>';

    h += '<h2 class="section-title">Courses</h2><section class="grid">';
    for (var k = 0; k < COURSES.length; k++) {
      var c = COURSES[k];
      var pr = Store.courseProgress(c);
      var pctc = pr.total ? pr.done / pr.total : 0;
      h += '<a class="cover" style="--ah:' + HUES[k % HUES.length] + '" href="#/course/' + esc(c.id) + '">' +
        '<div class="cover-top">' +
          '<span class="cat">' + esc(c.category) + '</span>' +
          '<div class="cover-art">' + Art.svg(coverArt(c)) + '</div>' +
        '</div>' +
        '<div class="cover-body">' +
          '<h3>' + esc(c.title) + '</h3>' +
          '<p>' + esc(c.tagline) + '</p>' +
          '<div class="cover-meta"><div class="bar"><i style="width:' + Math.round(pctc * 100) + '%"></i></div>' +
          '<span>' + (pr.done ? pr.done + '/' + pr.total : c.lessons.length + ' lessons') + '</span></div>' +
        '</div></a>';
    }
    h += '</section></main>';
    $app.innerHTML = h;
    bindChrome();
    maybeShowTour();
  }

  function maybeShowTour() {
    if (Store.state.toured || Store.state.xp > 0) return;
    if (document.querySelector('.modal-wrap')) return;
    var wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = '<div class="modal tour">' +
      '<h2>Welcome to Prism</h2>' +
      '<div class="tour-row"><span class="tour-art">' + Art.svg('book') + '</span><p><b>Learn in cards.</b> Six courses of short visual lessons — psychology, philosophy, money and more — with quizzes woven in.</p></div>' +
      '<div class="tour-row"><span class="tour-art">' + Art.svg('orbit') + '</span><p><b>Remember with review.</b> Finished lessons become flashcards, scheduled just before you’d forget them.</p></div>' +
      '<div class="tour-row"><span class="tour-art">' + Art.svg('flame') + '</span><p><b>Make it a habit.</b> Hit your daily XP goal to grow a streak, level up, and earn achievements.</p></div>' +
      '<div class="modal-row"><button class="btn primary" id="tour-go">Start learning</button></div>' +
    '</div>';
    document.body.appendChild(wrap);
    function done() { Store.markToured(); wrap.remove(); }
    wrap.addEventListener('click', function (e) { if (e.target === wrap) done(); });
    document.getElementById('tour-go').onclick = done;
  }

  /* ---------------- course view ---------------- */

  function renderCourse(cid) {
    var c = findCourse(cid);
    if (!c) return nav('#/');
    var hue = courseHue(cid);
    var pr = Store.courseProgress(c);

    var h = headerHTML() + '<main class="page" style="--ah:' + hue + '">';
    h += '<a class="back" href="#/">‹ Library</a>';
    h += '<section class="course-hero">' +
      '<div class="course-hero-art">' + Art.svg(coverArt(c)) + '</div>' +
      '<div class="course-hero-text">' +
        '<span class="cat">' + esc(c.category) + '</span>' +
        '<h1>' + esc(c.title) + '</h1>' +
        '<p class="tagline">' + esc(c.tagline) + '</p>' +
        '<p class="desc">' + esc(c.description) + '</p>' +
        '<div class="cover-meta wide"><div class="bar"><i style="width:' + (pr.total ? Math.round(100 * pr.done / pr.total) : 0) + '%"></i></div>' +
        '<span>' + pr.done + ' of ' + pr.total + ' complete</span></div>' +
        (pr.done ? '<a class="btn ghost small" href="#/practice/' + esc(c.id) + '">Practice this course</a>' : '') +
      '</div></section>';

    h += '<section class="lessons">';
    for (var i = 0; i < c.lessons.length; i++) {
      var l = c.lessons[i];
      var rec = Store.lessonRecord(c.id, l.id);
      var quizN = 0;
      for (var q = 0; q < l.cards.length; q++) if (isInteractive(l.cards[q])) quizN++;
      h += '<a class="lesson-row' + (rec ? ' done' : '') + '" href="#/lesson/' + esc(c.id) + '/' + esc(l.id) + '">' +
        '<span class="lesson-n">' + (rec
          ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : (i + 1)) + '</span>' +
        '<span class="lesson-txt"><b>' + esc(l.title) + '</b><small>' + esc(l.summary) + '</small></span>' +
        '<span class="lesson-side">' + (rec ? '<em>' + rec.best + '%</em>' : '<em class="mut">' + l.cards.length + ' cards · ' + quizN + ' quizzes</em>') + '<span class="go">›</span></span>' +
      '</a>';
    }
    h += '</section></main>';
    $app.innerHTML = h;
    bindChrome();

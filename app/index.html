<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<meta name="description" content="VitalArc — track the habits that shape your healthspan, and find out which ones actually move your numbers.">
<title>VitalArc</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%231f6f5c'/><path d='M14 40c6-16 12-22 18-22s12 6 18 22' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">V</span> VitalArc</div>
    <div class="spacer"></div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
  </header>
  <main id="main" role="main"><div class="card empty-state"><p class="muted">Loading…</p></div></main>
</div>
<div id="update-banner" class="update-banner" role="status" hidden>
  <span>A new version of VitalArc is ready.</span>
  <button class="btn btn-sm btn-primary" data-action="apply-update">Reload</button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" class="hidden" aria-hidden="true">
<noscript><div class="app"><div class="card"><h2>JavaScript required</h2>
  <p>VitalArc runs entirely in your browser — there is no server doing the work — so it needs JavaScript enabled.</p></div></div></noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>

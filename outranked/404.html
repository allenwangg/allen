<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTRANKED</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Spline+Sans+Mono:wght@700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#FBF8F2;color:#171A1F;font-family:"Plus Jakarta Sans",system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:2px solid #E8E2D6;border-radius:22px;box-shadow:0 5px 0 #E8E2D6;padding:44px 48px;text-align:center;max-width:460px}
.code{font-family:"Spline Sans Mono",monospace;font-size:56px;font-weight:700;color:#F5A524;letter-spacing:-.04em}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
p{color:#6C7079;font-weight:600;margin-top:10px;font-size:15.5px}
a{display:inline-block;margin-top:22px;background:#0E9F5B;color:#fff;font-weight:800;padding:13px 24px;border-radius:14px;text-decoration:none;box-shadow:0 4px 0 #0A7B45}
a:active{transform:translateY(3px);box-shadow:0 1px 0 #0A7B45}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <h1>This page got outbid.</h1>
  <p>Whatever was here couldn't afford to stay. The board, however, is very much alive — and today's crown resets at midnight.</p>
  <a href="/">Back to the board</a>
</div>
</body>
</html>

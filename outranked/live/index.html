const style = document.createElement("style");

/* ---------- self-publishing machinery ---------- */
let store = null, readOnly = false, storeReady;
if (typeof claude !== "undefined" && claude.use) {
  storeReady = claude.use("artifact").then(ns => { store = ns; if (!store) localNote(); }).catch(() => localNote());
} else { storeReady = Promise.resolve(); localNote(); }

function localNote(){
  const b = $("#banner");
  b.innerHTML = "<b>Sandbox view</b> — live sync isn't available here, so bids stay on this device. Everything else works.";
  b.classList.add("show");
}
function readOnlyNote(){
  readOnly = true;
  const b = $("#banner");
  b.innerHTML = "<b>Read-only view</b> — you can watch the board live, but your bids stay on this device.";
  b.classList.add("show");
}

function buildHTML(st){
  const json = JSON.stringify(st).replace(/</g, "\\u003c");
  const src = BOOT_SRC
    .replace(/\/\*STATE\*\/[\s\S]*?\/\*END\*\//, () => "/*STATE*/" + json + "/*END*/");
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>OUTRANKED</title>\n</head>\n<body>\n<script id="boot">' + src + '</scr' + 'ipt>\n</body>\n</html>\n';
}

async function commit(toastMsg, brag){
  try { sessionStorage.setItem("outranked_celebrate", JSON.stringify({ t: toastMsg, b: brag || "" })); } catch(e) {}
  await storeReady;
  if (!store || readOnly) { render(); celebrate(); return; }
  try {
    await store.publish(buildHTML(state));   /* success → this view reloads */
  } catch (e) {
    const code = e && e.code;
    if (code === "conflict") return;         /* a newer version won; reload is coming */
    if (code === "not_granted" || code === "not_writer" || code === "consent_required" ||
        code === "capability_disabled" || code === "capability_removed" || code === "not_declared") {
      readOnlyNote(); render(); celebrate(); return;
    }
    if (code === "rate_limited") { render(); showToast("Easy, tycoon — bids are coming in too fast. Yours is kept on this device."); return; }
    render(); showToast("Couldn't sync that bid — it's kept on this device.");
  }
}

/* ---------- state helpers ---------- */
const state = STATE;
let query = "";
let view = "today";
function todayStr(){ return new Date().toISOString().slice(0,10); }
function ensureToday(e){
  if (e.todayDate !== todayStr()){ e.todayDate = todayStr(); e.todayTotal = 0; }
  return e;
}
function touchToday(e, amount){
  ensureToday(e);
  if (state.firstBloodDay !== todayStr()){ state.firstBloodDay = todayStr(); award(e, "🩸 First Blood"); }
  e.todayTotal += amount;
}

const TIERS = [
  { at: 10000, cls:"t5", name:"Sovereign" },
  { at: 2000,  cls:"t4", name:"Archduke" },
  { at: 500,   cls:"t3", name:"Duke" },
  { at: 100,   cls:"t2", name:"Viscount" },
  { at: 0,     cls:"t1", name:"Baron" },
];
function tier(e){ return TIERS.find(t => e.total >= t.at); }
function medallion(e){
  const t = tier(e);
  return '<span class="med ' + t.cls + '" title="' + t.name + ' — lifetime ' + fmt(e.total) + '">' + esc(e.name[0].toUpperCase()) + '</span>';
}
function award(e, title){
  e.titles = e.titles || [];
  if (e.titles.includes(title)) return;
  e.titles.push(title);
  feed('🎖 <b>' + esc(e.name) + '</b> earned the title <b>' + title + '</b>');
}
function prevDayStr(day){
  const d = new Date(day + "T00:00:00Z"); d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
function rollover(){
  if (state.lastDay && state.lastDay !== todayStr()){
    let king = null;
    for (const e of state.entries)
      if (e.todayDate === state.lastDay && e.todayTotal > 0 && (!king || e.todayTotal > king.todayTotal)) king = e;
    if (king){
      state.hall = state.hall || [];
      state.hall.unshift({ date: state.lastDay, name: king.name, amount: king.todayTotal });
      state.hall = state.hall.slice(0, 30);
      king.streak = (king.lastWin === prevDayStr(state.lastDay)) ? (king.streak||1)+1 : 1;
      king.lastWin = state.lastDay;
      feed('🏆 <b>' + esc(king.name) + '</b> won ' + state.lastDay + ' with <span class="amt">' + fmt(king.todayTotal) + '</span> — engraved forever');
    }
  }
  state.lastDay = todayStr();
}
function sorted(){ return [...state.entries].sort((a,b) => b.total - a.total); }
function sortedToday(){ return state.entries.map(ensureToday).filter(e => e.todayTotal > 0).sort((a,b) => b.todayTotal - a.todayTotal); }
function rankMap(){ const m = {}; sorted().forEach((e,i) => m[e.id] = i+1); return m; }
function msToMidnightUTC(){
  const now = new Date();
  return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()+1) - now.getTime();
}
rollover();

/* demo hall + titles so the trophy shelf never starts empty */
if (!state.hall){
  const d = todayStr();
  state.hall = [
    { date: prevDayStr(d), name: "JONI", amount: 4210 },
    { date: prevDayStr(prevDayStr(d)), name: "ShipFast", amount: 2150 },
    { date: prevDayStr(prevDayStr(prevDayStr(d))), name: "JONI", amount: 3675 },
  ];
  const joni = state.entries.find(e => e.name === "JONI");
  if (joni){ joni.titles = ["🩸 First Blood"]; joni.streak = 1; joni.lastWin = prevDayStr(d); }
  const ship = state.entries.find(e => e.name === "ShipFast");
  if (ship) ship.titles = ["⚔️ Kingslayer", "🛡 Defender"];
  const cal = state.entries.find(e => e.name === "CalAI");
  if (cal) cal.titles = ["🐋 Whale"];
}

/* demo seeding: give today's board a small bid war on days with no activity yet */
if (state.todaySeed){
  for (const e of state.entries){
    if (e.todayDate !== todayStr() && state.todaySeed[e.name]){
      ensureToday(e);
      e.todayTotal = state.todaySeed[e.name];
    }
  }
}
let prevRanks = rankMap();
function dur(ms){
  const m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if (d>0) return d + "d " + (h%24) + "h"; if (h>0) return h + "h " + (m%60) + "m"; return m + "m";
}
function feed(html){ state.feed.unshift(html); state.feed = state.feed.slice(0,20); }

/* ---------- rendering ---------- */
function spark(hist){
  const h = hist.slice(-12); if (h.length < 2) h.unshift(0);
  const max = Math.max(...h), min = Math.min(...h), span = (max-min) || 1;
  const pts = h.map((v,i) => [(i/(h.length-1))*80+2, 24-((v-min)/span)*20+1]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const end = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 84 26" aria-hidden="true"><polygon class="fill" points="' + line + ' 82,26 2,26"/><polyline points="' + line + '"/><circle class="dot" cx="' + end[0].toFixed(1) + '" cy="' + end[1].toFixed(1) + '" r="2.5"/></svg>';
}

        '<div class="crown-sub">Win the day and enter the Hall of Fame forever</div></div>' +
        '<div class="crown-right"><div class="crown-amt num">' + fmt(king.todayTotal) + '</div>' +
        '<button class="take" data-take="' + king.id + '">Take today\'s crown — ' + fmt(king.todayTotal+1) + '<small>everyone starts even again at midnight</small></button></div></div>'
      : '<div class="crown-card">' +
        '<div class="crown-emoji">🔥</div>' +
        '<div><div class="crown-name">Nobody has bid today</div>' +
        '<div class="crown-sub">Today\'s crown is basically free. Resets in <b class="num">' + dur(msToMidnightUTC()) + '</b>.</div></div>' +
        '<div class="crown-right"><button class="take" data-open-bid>Take it — ' + fmt(MIN_NEW) + '</button></div></div>';
  } else {
    const top = list[0];
    $("#crown").innerHTML =
      '<div class="crown-card">' +
        '<div class="crown-emoji">👑</div>' +

        '<div class="crown-sub">Longest reign ever: <b>' + esc(state.longestReign.name) + '</b> — ' + dur(state.longestReign.ms) + '</div></div>' +
        '<div class="crown-right"><div class="crown-amt num">' + fmt(top.total) + '</div>' +
        '<button class="take" data-take="' + top.id + '">Dethrone — ' + fmt(top.total+1) + ' total<small>top-ups only pay the difference</small></button>' +
        '<a class="dare" id="dareLink" href="' + tweetIntent("Someone paid " + fmt(top.total) + " to be #1 on OUTRANKED. It costs exactly " + fmt(top.total+1) + " to take it from them: " + SHARE_URL) + '" target="_blank" rel="noopener">📣 dare someone to dethrone them</a></div></div>';
  }

  const q = query.trim().toLowerCase();
  $("#board").innerHTML = list.map((e,i) => {
    if (q && !(e.name.toLowerCase().includes(q) || e.url.toLowerCase().includes(q))) return "";
    const rank = i+1;

    }
    const hot = e.history.length > 3 && e.history[e.history.length-1] - e.history[e.history.length-4] > e.total*0.25;
    const amt = isToday ? e.todayTotal : e.total;
    const sub = isToday ? ('all-time ' + fmt(e.total)) : (e.bids + ' bid' + (e.bids === 1 ? '' : 's'));
    const takeLabel = rank === 1 ? (isToday ? 'Take today\'s #1' : 'Dethrone') : 'Take #' + rank;
    const titles = (e.titles||[]).slice(0,2).map(t => '<span class="badge title">' + t + '</span>').join("");
    const more = (e.titles||[]).length > 2 ? '<span class="badge title">+' + (e.titles.length-2) + '</span>' : '';
    return '<div class="row" data-id="' + e.id + '">' +
      '<div class="rank num">' + rank + mv + '</div>' +
      '<div class="who">' + medallion(e) + '<div><span class="nm">' + esc(e.name) +
        (e.defend > 0 ? ' <span class="badge shield" title="Auto-defend armed">🛡 DEFENDED</span>' : '') +
        (hot ? ' <span class="badge hot">🔥 HOT</span>' : '') + titles + more +
        (e.streak > 1 ? ' <span class="badge title">👑 ' + e.streak + '-day streak</span>' : '') + '</span>' +
        '<span class="tiername">' + tier(e).name + '</span>' +
        '<a class="url" href="https://' + esc(e.url) + '" target="_blank" rel="noopener nofollow">' + esc(e.url) + '</a></div></div>' +
      spark(e.history) +
      '<div class="money"><div class="amt num">' + fmt(amt) + '</div>' +
      '<div class="bids num">' + sub + '</div>' +
      '<button class="take" data-take="' + e.id + '">' + takeLabel + ' — ' + fmt(amt+1) + '</button></div></div>';
  }).join("") || (isToday && !q
    ? '<div class="row" style="grid-template-columns:1fr;color:var(--muted)">No bids yet today — first ' + fmt(MIN_NEW) + ' owns the board until midnight.</div>'
    : '<div class="row" style="grid-template-columns:1fr;color:var(--muted)">Nothing matches "' + esc(query) + '".</div>');

  $("#statRaised").textContent = fmt(state.entries.reduce((s,e) => s+e.total, 0));
  $("#statBids").textContent = state.stats.bids.toLocaleString();
  $("#statBiggest").textContent = fmt(state.stats.biggest);
  $("#statSpots").textContent = state.entries.length.toLocaleString();

  const items = state.feed.slice(0,12).map(f => '<span class="tick">' + f + '</span>').join("");
  $("#tickerInner").innerHTML = items + items;

    ? '<span class="h-title">🏆 Hall of Fame</span>' + state.hall.slice(0,14).map(h =>

/* ---------- bidding ---------- */
const modal = $("#bidModal");
function openBid(targetId){
  $("#bidErr").classList.remove("show");
  if (targetId){
    const t = state.entries.find(e => e.id === targetId);
    const isToday = view === "today";
    const beat = isToday ? ensureToday(t).todayTotal : t.total;
    const rank = isToday ? (sortedToday().indexOf(t)+1 || 1) : rankMap()[t.id];
    $("#modalTitle").textContent = rank === 1 ? "Dethrone " + t.name : "Overtake " + t.name + " (#" + rank + ")";
    $("#modalSub").textContent = isToday
      ? "They've bid " + fmt(beat) + " today. " + fmt(beat+1) + " takes the spot until midnight."
      : "They sit at " + fmt(t.total) + ". Beat it or boost your own spot.";
    $("#fAmt").value = Math.max(MIN_NEW, beat+1);
    $("#amtHint").textContent = "Prefilled to beat them by $1 — raise it to build a moat.";
  } else {
    $("#modalTitle").textContent = "Claim a spot";
    $("#modalSub").textContent = "$5 minimum. Your total is your rank.";
    $("#amtHint").textContent = "";
    $("#fAmt").value = "";
  }
  modal.showModal();
  $("#fName").focus();
}

function checkCrown(){
  const top = sorted()[0];
  if (top.id !== state.crownId){
    const reignMs = Date.now() - state.crownedAt;
    const old = state.entries.find(e => e.id === state.crownId);
    if (reignMs > state.longestReign.ms && old) state.longestReign = { name: old.name, ms: reignMs };
    if (old) feed('👑 <b>' + esc(top.name) + '</b> DETHRONED <b>' + esc(old.name) + '</b> after a ' + dur(reignMs) + ' reign');
    award(top, "⚔️ Kingslayer");
    state.crownId = top.id;
    state.crownedAt = Date.now();
  }
}

function runAutoDefend(aggressor){
  let acted = true, guard = 0;
  while (acted && guard++ < 50){
    acted = false;
    const list = sorted();
    for (const e of list){
      if (e.defend <= 0 || e.id === aggressor.id) continue;
      const myRank = list.indexOf(e);
      const justAhead = list[myRank-1];
      if (justAhead && justAhead.id === aggressor.id && e.defend >= 1){
        const need = Math.min(e.defend, justAhead.total - e.total + 1);
        if (need > 0){
          e.total += need; e.defend -= need; e.bids++; e.history.push(e.total);
          touchToday(e, need);
          state.stats.bids++;
          feed('🛡 <b>' + esc(e.name) + '</b> auto-defended with <span class="amt">' + fmt(need) + '</span> — back above <b>' + esc(aggressor.name) + '</b>');
          award(e, "🛡 Defender");
          acted = true;
        }
      }
    }
  }
  checkCrown();
}

function placeBid(name, url, amount, defendBudget){
  name = name.trim(); url = url.trim().replace(/^https?:\/\//, "");
  let entry = state.entries.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (entry){
    entry.total += amount; entry.bids++; entry.history.push(entry.total);
    if (entry.history.length > 24) entry.history = entry.history.slice(-24);
  } else {
    if (amount < MIN_NEW) return { ok:false, msg: "New listings start at " + fmt(MIN_NEW) + "." };
    entry = { id: "u" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36), name, url: url || "—", total: amount, bids: 1, history: [amount], defend: 0 };
    state.entries.push(entry);
  }
  touchToday(entry, amount);
  if (amount >= 500) award(entry, "🐋 Whale");
  if (defendBudget > 0) entry.defend = defendBudget;
  state.stats.bids++;
  state.stats.biggest = Math.max(state.stats.biggest, amount);
  const rank = rankMap()[entry.id];
  feed('<b>' + esc(entry.name) + '</b> bid <span class="amt">' + fmt(amount) + '</span> → now #' + rank);
  checkCrown();
  runAutoDefend(entry);
  return { ok:true, entry, rank: rankMap()[entry.id] };
}

    '<div class="w-stat"><b>' + state.stats.bids.toLocaleString() + '</b><span>Bids</span></div>' +
    '<div class="w-stat"><b>' + fmt(state.stats.biggest) + '</b><span>Biggest bid</span></div>';
  $("#wFeed").innerHTML = state.feed.slice(0,9).map(f => '<div class="ev">' + f + '</div>').join("");
  $("#wUrl").textContent = "Every viewer of this page bids on the same board — pay more, rank higher, stay on top";
}
function setWatch(on){
  watchOn = on;
  $("#watch").classList.toggle("on", on);
  document.documentElement.style.overflow = on ? "hidden" : "";
  if (on) renderWatch();
}
$("#watchBtn").addEventListener("click", () => setWatch(true));
$("#watchClose").addEventListener("click", () => setWatch(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && watchOn) setWatch(false); });

/* ---------- listing dossier ---------- */
const detailModal = $("#detailModal");
function sparkBig(hist){
  const h = hist.slice(-24); if (h.length < 2) h.unshift(0);
  const max = Math.max(...h), min = Math.min(...h), span = (max-min) || 1;
  const pts = h.map((v,i) => [(i/(h.length-1))*296+2, 58-((v-min)/span)*48+3]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const end = pts[pts.length-1];
  return '<svg class="d-spark" viewBox="0 0 300 64" aria-hidden="true"><polygon class="fill" points="' + line + ' 298,64 2,64"/><polyline points="' + line + '"/><circle class="dot" cx="' + end[0].toFixed(1) + '" cy="' + end[1].toFixed(1) + '" r="3"/></svg>';
}
function openDetail(id){
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  ensureToday(e);
  const t = tier(e);
  const rank = rankMap()[e.id];
  const avg = e.bids ? Math.round(e.total/e.bids) : e.total;
  const badges = [
    '<span class="badge title">' + t.name + '</span>',
    ...(e.titles||[]).map(x => '<span class="badge title">' + x + '</span>'),
    e.streak > 1 ? '<span class="badge title">👑 ' + e.streak + '-day streak</span>' : "",
    e.defend > 0 ? '<span class="badge shield">🛡 defending with ' + fmt(e.defend) + '</span>' : "",
  ].filter(Boolean).join("");
  $("#detailBody").innerHTML =
    '<div class="d-head">' + medallion(e) +
      '<div><div class="nm">' + esc(e.name) + '</div>' +
      '<div class="t">#' + rank + ' all-time · <a href="https://' + esc(e.url) + '" target="_blank" rel="noopener nofollow">' + esc(e.url) + '</a></div></div></div>' +
    '<div class="d-badges">' + badges + '</div>' +
    sparkBig(e.history) +
    '<div class="d-grid">' +
      '<div class="d-cell"><b>' + fmt(e.total) + '</b><span>All-time</span></div>' +
      '<div class="d-cell"><b>' + fmt(e.todayTotal||0) + '</b><span>Today</span></div>' +
      '<div class="d-cell"><b>' + e.bids + '</b><span>Bids</span></div>' +
      '<div class="d-cell"><b>' + fmt(avg) + '</b><span>Avg bid</span></div>' +
      '<div class="d-cell"><b>' + (e.titles||[]).length + '</b><span>Titles</span></div>' +
      '<div class="d-cell"><b>' + fmt((view==="today" ? (e.todayTotal||0) : e.total) + 1) + '</b><span>To take</span></div>' +
    '</div>' +
    '<div class="mrow">' +
      '<button type="button" class="ghost" data-close-detail>Close</button>' +
      '<a class="ghost" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="' +
        tweetIntent(e.name + " sits at #" + rank + " on OUTRANKED with " + fmt(e.total) + ". Taking it costs " + fmt(e.total+1) + ": " + SHARE_URL) + '">Dare on 𝕏</a>' +
      '<button type="button" class="cta" data-boost="' + e.id + '">Boost — ' + fmt((view==="today" ? (e.todayTotal||0) : e.total) + 1) + '</button>' +
    '</div>';
  detailModal.showModal();
}

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const take = e.target.closest("[data-take]");
  if (take) return openBid(take.dataset.take);
  const boost = e.target.closest("[data-boost]");
  if (boost){ detailModal.close(); return openBid(boost.dataset.boost); }
  if (e.target.closest("[data-close-detail]")) return detailModal.close();
  if (e.target.closest("[data-open-bid]")) return openBid(null);
  if (e.target.closest("[data-close]")) return modal.close();
  const tab = e.target.closest(".tab[data-view]");
  if (tab){
    view = tab.dataset.view;
    document.querySelectorAll(".tab").forEach(t => {
      const on = t.dataset.view === view;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on);
    });
    render();
    return;
  }
  if (e.target.closest("a.url")) return;
  const row = e.target.closest("#board .row[data-id]");
  if (row) openDetail(row.dataset.id);
});
$("#fDefend").addEventListener("change", e => { $("#fBudget").disabled = !e.target.checked; if (e.target.checked) $("#fBudget").focus(); });
$("#bidForm").addEventListener("submit", e => {
  e.preventDefault();
  const err = $("#bidErr");
  const name = $("#fName").value, url = $("#fUrl").value;
  const amount = Math.floor(+$("#fAmt").value);
  const defendBudget = $("#fDefend").checked ? Math.max(0, Math.floor(+$("#fBudget").value || 0)) : 0;
  if (!name.trim()){ err.textContent = "A name is required — this is a leaderboard, not witness protection."; err.classList.add("show"); return; }
  if (!amount || amount < 1){ err.textContent = "Bid at least $1."; err.classList.add("show"); return; }
  const res = placeBid(name, url, amount, defendBudget);
  if (!res.ok){ err.textContent = res.msg; err.classList.add("show"); return; }
  modal.close();
  const brag = tweetIntent("I just paid " + fmt(amount) + " to make " + res.entry.name + " #" + res.rank + " on OUTRANKED 👑 Outbid me if you dare: " + SHARE_URL);
  commit("💸 Paid " + fmt(amount) + " — " + res.entry.name + " is #" + res.rank + (defendBudget ? " · 🛡 defending with " + fmt(defendBudget) : ""), brag);
});
$("#search").addEventListener("input", e => { query = e.target.value; render(); });

let toastTimer;
function showToast(text){
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
}

/* ---------- viral loops + celebration ---------- */
const SHARE_URL = "https://claude.ai/code/artifact/2e073757-ea85-49b4-b889-f43609793991";
function tweetIntent(text){ return "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text); }
let shareTimer;
function showShareBar(href){
  if (!href) return;
  $("#bragBtn").href = href;
  $("#sharebar").classList.add("show");
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => $("#sharebar").classList.remove("show"), 30000);
}
$("#shareClose").addEventListener("click", () => $("#sharebar").classList.remove("show"));

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#d9a944","#63c08e","#ecefe6","#d95c6e"];
  const bits = Array.from({length: 90}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*160, y: innerHeight*0.62,
    vx: (Math.random()-.5)*11, vy: -(5+Math.random()*9),
    s: 4+Math.random()*4, c: colors[Math.floor(Math.random()*colors.length)], r: Math.random()*Math.PI
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for (const b of bits){
      b.x += b.vx; b.y += b.vy; b.vy += .32; b.r += .1;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s/2,-b.s/2,b.s,b.s); ctx.restore();
    }
    if (++frames < 110) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* Show toast + brag bar + confetti — directly in sandbox mode, or after the
   publish-triggered reload via the sessionStorage stash. */
function celebrate(){
  try {
    const raw = sessionStorage.getItem("outranked_celebrate");
    if (!raw) return;
    sessionStorage.removeItem("outranked_celebrate");
    const { t, b } = JSON.parse(raw);
    if (t) showToast(t);
    showShareBar(b);
    confetti();
  } catch(e) {}
}

render();
setInterval(() => { const el = $("#reignClock"); if (el) el.textContent = dur(Date.now() - state.crownedAt); }, 30000);
celebrate();
</script>

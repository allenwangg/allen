/* ============================================================

:root{

  }
}
:root[data-theme="dark"]{

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.55 "Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.num{font-family:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.display,.logo,.hero h1,.crown-name,.mbody h2{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
a{color:var(--money);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--status);outline-offset:2px;border-radius:8px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}

/* ---- pressable keys: the signature control ---- */
.key{border-radius:14px;font-weight:800;padding:12px 20px;transition:transform .08s ease, box-shadow .08s ease, filter .15s}
.key:active{transform:translateY(3px)}
.cta{background:var(--money);color:#fff;border-radius:14px;font-weight:800;padding:12px 20px;
  box-shadow:0 4px 0 var(--money-edge);transition:transform .08s ease, box-shadow .08s ease, filter .15s}
.cta:hover{filter:brightness(1.06)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--money-edge)}

/* ---- header ---- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 18px;max-width:900px;margin:0 auto}
.logo{font-size:21px}
.logo .up{color:var(--crown)}
.spacer{flex:1}
.iconbtn{padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;color:var(--muted);background:var(--card);
  box-shadow:0 2px 0 var(--line);transition:transform .08s, box-shadow .08s}
.iconbtn:hover{color:var(--ink);border-color:var(--rule)}
.iconbtn:active{transform:translateY(2px);box-shadow:none}

/* ---- hero ---- */
.hero{text-align:center;padding:44px 0 4px}
.hero h1{font-size:clamp(34px,6.2vw,58px);line-height:1.04;letter-spacing:-.035em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--money)}
.hero p{color:var(--muted);margin:16px auto 0;font-size:18px;max-width:34ch}
.how{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.step{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;font-size:13.5px;text-align:left;box-shadow:0 2px 0 var(--line)}
.step b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.step:nth-child(1) b{color:var(--money)}
.step:nth-child(2) b{color:var(--crown)}
.step:nth-child(3) b{color:var(--status)}
.step span{color:var(--muted)}

/* ---- ribbon ---- */
.ribbon{display:none;background:var(--crown-soft);border:1.5px solid var(--crown);border-radius:14px;padding:11px 16px;font-size:13.5px;color:var(--muted);margin:18px 0 4px;text-align:center}
.ribbon.show{display:block}
.ribbon b{color:var(--ink)}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 0 6px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 0 var(--line)}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--ink)}
.stat:nth-child(1) b{color:var(--money)}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--heat);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---- ticker ---- */
.ticker{overflow:hidden;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin:18px 0;position:relative;box-shadow:0 2px 0 var(--line)}
.ticker::before{content:"LIVE";position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;padding:0 14px;background:var(--heat);color:#fff;font-weight:800;font-size:11px;letter-spacing:.1em;z-index:2}
.ticker-inner{display:flex;gap:34px;white-space:nowrap;padding:12px 0 12px 68px;animation:scroll 36s linear infinite}
.ticker:hover .ticker-inner{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.tick{color:var(--muted);font-size:14px}
.tick b{color:var(--ink);font-weight:700}
.tick .amt{color:var(--money);font-weight:800}

/* ---- crown card ---- */
.crown-card{background:var(--card);border:2px solid var(--crown);border-radius:20px;padding:22px;display:flex;align-items:center;gap:18px;
  box-shadow:0 5px 0 var(--crown-edge), var(--shadow);margin:6px 0 18px;position:relative;overflow:hidden}
.crown-emoji{font-size:44px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.crown-name{font-size:27px;line-height:1.1}
.crown-sub{color:var(--muted);font-size:14px;margin-top:2px}
.crown-sub b{color:var(--ink)}
.crown-right{margin-left:auto;text-align:right}
.crown-amt{font-size:30px;font-weight:800;color:var(--crown);font-family:"Spline Sans Mono",monospace;letter-spacing:-.03em}
.decree{display:inline-block;margin-top:8px;background:var(--crown-soft);border:1.5px solid var(--crown);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.decree::before{content:"📜 “"}
.decree::after{content:"”"}
.crown-card.final{border-color:var(--heat);box-shadow:0 5px 0 var(--heat-edge), var(--shadow)}
.crown-card.final .crown-amt{color:var(--heat)}
.final-tag{display:none;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--heat)}
.crown-card.final .final-tag{display:inline;animation:pulse 1.2s infinite}
.dare{display:block;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.dare:hover{color:var(--crown);text-decoration:none}

/* ---- take buttons (money keys) ---- */
.take{background:var(--money);color:#fff;border-radius:13px;padding:10px 15px;font-size:13.5px;font-weight:800;white-space:nowrap;
  box-shadow:0 4px 0 var(--money-edge);transition:transform .08s, box-shadow .08s, filter .15s}
.take:hover{filter:brightness(1.07)}
.take:active{transform:translateY(3px);box-shadow:0 1px 0 var(--money-edge)}
.take small{display:block;font-weight:600;font-size:11px;opacity:.85;margin-top:1px}

/* ---- tabs ---- */
.tabs{display:flex;gap:10px;margin:4px 0 12px}
.tab{flex:1;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--muted);font-weight:800;font-size:14.5px;
  box-shadow:0 3px 0 var(--line);transition:transform .08s, box-shadow .08s}
.tab:hover{color:var(--ink)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tab.active{border-color:var(--crown);color:var(--ink);background:var(--crown-soft);box-shadow:0 3px 0 var(--crown-edge)}

/* ---- your empire ---- */
.empire{display:none;background:var(--status-soft);border:1.5px solid var(--status);border-radius:16px;padding:13px 18px;margin:0 0 14px;font-size:14px;color:var(--muted);align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.empire.show{display:flex}
.empire b{color:var(--ink)}
.empire .next{margin-left:auto;color:var(--status);font-weight:800}
.empire .bar{flex-basis:100%;height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--line)}
.empire .fill{height:100%;background:linear-gradient(90deg,var(--status),var(--crown));border-radius:99px;transition:width .6s}

/* ---- toolbar ---- */
.toolbar{display:flex;gap:10px;margin:8px 0 14px}
.search{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--ink);font:inherit;font-weight:600;box-shadow:0 2px 0 var(--line)}
.search::placeholder{color:var(--dim);font-weight:500}
.search:focus{border-color:var(--status);outline:none}

/* ---- board rows ---- */
.board{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.row{display:grid;grid-template-columns:56px 1fr auto auto;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;
  box-shadow:0 2px 0 var(--line);cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, border-color .12s}
.row:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--line), var(--shadow-lift);border-color:var(--rule)}
.row.flash{animation:flash 1s}
@keyframes flash{0%{background:var(--money-soft);border-color:var(--money)}100%{background:var(--card)}}
.rank{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--inset);color:var(--muted);font-weight:800;font-size:18px;font-family:"Spline Sans Mono",monospace}
.row:nth-child(1) .rank{background:var(--crown);color:#fff}
.row:nth-child(2) .rank{background:#8E9AAB;color:#fff}
.row:nth-child(3) .rank{background:#B87333;color:#fff}
.mv{display:block;font-size:10px;font-weight:800;line-height:1}
.mv.up{color:var(--money)}.mv.down{color:var(--heat)}.mv.same{color:transparent}
.row:nth-child(-n+3) .mv.up,.row:nth-child(-n+3) .mv.down{color:#fff}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who > div{min-width:0}
.nm{font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:99px;flex-shrink:0}
.badge.shield{background:var(--money-soft);color:var(--money-edge)}
.badge.ok{background:var(--money-soft);color:var(--money-edge)}
.badge.hot{background:var(--heat-soft);color:var(--heat-edge)}
.badge.title{background:var(--status-soft);color:var(--status)}
.tiername{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--dim);text-transform:uppercase;display:block;margin-top:2px}
.url{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:500}
.spark{width:88px;height:30px;flex-shrink:0}
.spark polyline{fill:none;stroke:var(--money);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark .fill{fill:color-mix(in srgb,var(--money) 14%,transparent);stroke:none}
.spark .dot{fill:var(--money)}
.money{text-align:right}
.money .amt{font-weight:800;font-size:19px;font-family:"Spline Sans Mono",monospace;letter-spacing:-.03em}
.money .bids{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}

/* ---- medallions ---- */
.med{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:14px;color:#fff;background:var(--dim);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.med.t1{background:#B87333}
.med.t2{background:#7C8AA0}
.med.t3{background:var(--crown)}
.med.t4{background:var(--status)}
.med.t5{background:linear-gradient(135deg,var(--money),var(--crown));box-shadow:0 0 0 3px var(--crown-soft)}

/* ---- hall of fame ---- */
.hall{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:18px}
.hall .h-title{flex-shrink:0;font-weight:800;font-size:14px;color:var(--crown);padding:12px 6px 12px 2px;white-space:nowrap}
.trophy{flex-shrink:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 15px;font-size:12px;color:var(--muted);white-space:nowrap;box-shadow:0 2px 0 var(--line);font-weight:600}
.trophy b{display:block;color:var(--ink);font-size:13.5px;font-weight:800}
.trophy .num{color:var(--crown);font-weight:800}

/* ---- rules + footer ---- */
details.rules{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:24px;box-shadow:0 2px 0 var(--line)}
details.rules summary{cursor:pointer;font-weight:800;list-style:none;font-size:16px}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::before{content:"▸ ";color:var(--money)}
details.rules[open] summary::before{content:"▾ "}
details.rules ol{margin:14px 0 0 20px;color:var(--muted);font-size:14.5px;display:grid;gap:9px}
details.rules b{color:var(--ink)}
footer{border-top:1.5px solid var(--line);padding:24px 0 40px;color:var(--dim);font-size:13px;text-align:center;font-weight:500}

/* ---- modals ---- */
dialog{margin:auto;border:2px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:0;max-width:460px;width:calc(100vw - 32px);box-shadow:var(--shadow-lift)}
dialog::backdrop{background:rgba(23,26,31,.45);backdrop-filter:blur(4px)}
.mbody{padding:24px}
.mbody h2{font-size:23px;margin-bottom:4px}
.mbody .sub{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.field input{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;color:var(--ink);font:inherit;font-weight:600}
.field input:focus{border-color:var(--status);outline:none}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;font-weight:500}

.defend input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--money);flex-shrink:0}
.defend .t{font-size:13.5px;flex:1}
.defend .t b{display:block;font-weight:800}
.defend .t span{color:var(--muted);font-size:12.5px}
.defend .t input{margin-top:8px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink);font:inherit;font-weight:600}
.mrow{display:flex;gap:10px}
.mrow .cta{flex:1;padding:14px;text-align:center;font-size:15.5px}
.ghost{padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;color:var(--muted);font-weight:800;background:var(--card);box-shadow:0 3px 0 var(--line);transition:transform .08s, box-shadow .08s}
.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.err{color:var(--heat-edge);font-size:13.5px;margin-bottom:12px;display:none;font-weight:700;background:var(--heat-soft);border-radius:11px;padding:10px 13px}
.err.show{display:block}

.d-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.d-head .med{width:54px;height:54px;font-size:22px;border-radius:18px}
.d-head .nm{font-weight:800;font-size:24px;line-height:1.1}
.d-head .t{color:var(--muted);font-size:13px;font-weight:600}
.d-badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.d-spark{width:100%;height:70px;margin:4px 0 14px}
.d-spark polyline{fill:none;stroke:var(--money);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.d-spark .fill{fill:color-mix(in srgb,var(--money) 13%,transparent);stroke:none}
.d-spark .dot{fill:var(--money)}

/* ---------- self-publishing machinery ---------- */
let store = null, readOnly = false, storeReady;
if (typeof claude !== "undefined" && claude.use) {
  storeReady = claude.use("artifact").then(ns => { store = ns; if (!store) localNote(); }).catch(() => localNote());
} else { storeReady = Promise.resolve(); localNote(); }

function localNote(){
  const b = $("#banner");
  b.innerHTML = "<b>Sandbox view</b> — live sync isn't available here, so bids stay on this device. Everything else works.";
  b.classList.add("show");
}
function readOnlyNote(){
  readOnly = true;
  const b = $("#banner");
  b.innerHTML = "<b>Read-only view</b> — you can watch the board live, but your bids stay on this device.";
  b.classList.add("show");
}

function buildHTML(st){
  const json = JSON.stringify(st).replace(/</g, "\\u003c");
  const src = BOOT_SRC
    .replace(/\/\*STATE\*\/[\s\S]*?\/\*END\*\//, () => "/*STATE*/" + json + "/*END*/");
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>OUTRANKED</title>\n</head>\n<body>\n<script id="boot">' + src + '</scr' + 'ipt>\n</body>\n</html>\n';
}

async function commit(toastMsg, brag){
  try { sessionStorage.setItem("outranked_celebrate", JSON.stringify({ t: toastMsg, b: brag || "" })); } catch(e) {}
  await storeReady;
  if (!store || readOnly) { render(); celebrate(); return; }
  try {
    await store.publish(buildHTML(state));   /* success → this view reloads */
  } catch (e) {
    const code = e && e.code;
    if (code === "conflict") return;         /* a newer version won; reload is coming */
    if (code === "not_granted" || code === "not_writer" || code === "consent_required" ||
        code === "capability_disabled" || code === "capability_removed" || code === "not_declared") {
      readOnlyNote(); render(); celebrate(); return;
    }
    if (code === "rate_limited") { render(); showToast("Easy, tycoon — bids are coming in too fast. Yours is kept on this device."); return; }
    render(); showToast("Couldn't sync that bid — it's kept on this device.");
  }
}

/* ---------- state helpers ---------- */
const state = STATE;
let query = "";
let view = "today";
function todayStr(){ return new Date().toISOString().slice(0,10); }
function ensureToday(e){
  if (e.todayDate !== todayStr()){ e.todayDate = todayStr(); e.todayTotal = 0; }
  return e;
}
function touchToday(e, amount){
  ensureToday(e);
  if (state.firstBloodDay !== todayStr()){ state.firstBloodDay = todayStr(); award(e, "🩸 First Blood"); }
  e.todayTotal += amount;
}

const TIERS = [
  { at: 10000, cls:"t5", name:"Sovereign" },
  { at: 2000,  cls:"t4", name:"Archduke" },
  { at: 500,   cls:"t3", name:"Duke" },
  { at: 100,   cls:"t2", name:"Viscount" },
  { at: 0,     cls:"t1", name:"Baron" },
];
function tier(e){ return TIERS.find(t => e.total >= t.at); }
function medallion(e){
  const t = tier(e);
  return '<span class="med ' + t.cls + '" title="' + t.name + ' — lifetime ' + fmt(e.total) + '">' + esc(e.name[0].toUpperCase()) + '</span>';
}
function award(e, title){
  e.titles = e.titles || [];
  if (e.titles.includes(title)) return;
  e.titles.push(title);
  feed('🎖 <b>' + esc(e.name) + '</b> earned the title <b>' + title + '</b>');
}
function prevDayStr(day){
  const d = new Date(day + "T00:00:00Z"); d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
function rollover(){
  if (state.lastDay && state.lastDay !== todayStr()){
    let king = null;
    for (const e of state.entries)
      if (e.todayDate === state.lastDay && e.todayTotal > 0 && (!king || e.todayTotal > king.todayTotal)) king = e;
    if (king){
      state.hall = state.hall || [];
      state.hall.unshift({ date: state.lastDay, name: king.name, amount: king.todayTotal });
      state.hall = state.hall.slice(0, 30);
      king.streak = (king.lastWin === prevDayStr(state.lastDay)) ? (king.streak||1)+1 : 1;
      king.lastWin = state.lastDay;
      feed('🏆 <b>' + esc(king.name) + '</b> won ' + state.lastDay + ' with <span class="amt">' + fmt(king.todayTotal) + '</span> — engraved forever');
    }
    delete state.todayDecree;
  }
  state.lastDay = todayStr();
}
function sorted(){ return [...state.entries].sort((a,b) => b.total - a.total); }
function sortedToday(){ return state.entries.map(ensureToday).filter(e => e.todayTotal > 0).sort((a,b) => b.todayTotal - a.todayTotal); }
function rankMap(){ const m = {}; sorted().forEach((e,i) => m[e.id] = i+1); return m; }
function msToMidnightUTC(){
  const now = new Date();
  return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()+1) - now.getTime();
}
rollover();

/* demo hall + titles so the trophy shelf never starts empty */
if (!state.hall){
  const d = todayStr();
  state.hall = [
    { date: prevDayStr(d), name: "JONI", amount: 4210 },
    { date: prevDayStr(prevDayStr(d)), name: "ShipFast", amount: 2150 },
    { date: prevDayStr(prevDayStr(prevDayStr(d))), name: "JONI", amount: 3675 },
  ];
  const joni = state.entries.find(e => e.name === "JONI");
  if (joni){ joni.titles = ["🩸 First Blood"]; joni.streak = 1; joni.lastWin = prevDayStr(d); }
  const ship = state.entries.find(e => e.name === "ShipFast");
  if (ship) ship.titles = ["⚔️ Kingslayer", "🛡 Defender"];
  const cal = state.entries.find(e => e.name === "CalAI");
  if (cal) cal.titles = ["🐋 Whale"];
}

/* demo seeding: give today's board a small bid war on days with no activity yet */
if (state.todaySeed){
  for (const e of state.entries){
    if (e.todayDate !== todayStr() && state.todaySeed[e.name]){
      ensureToday(e);
      e.todayTotal = state.todaySeed[e.name];
    }
  }
}
let prevRanks = rankMap();
function dur(ms){
  const m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if (d>0) return d + "d " + (h%24) + "h"; if (h>0) return h + "h " + (m%60) + "m"; return m + "m";
}
function feed(html){ state.feed.unshift(html); state.feed = state.feed.slice(0,20); }

/* ---------- rendering ---------- */
function spark(hist){
  const h = hist.slice(-12); if (h.length < 2) h.unshift(0);
  const max = Math.max(...h), min = Math.min(...h), span = (max-min) || 1;
  const pts = h.map((v,i) => [(i/(h.length-1))*80+2, 24-((v-min)/span)*20+1]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const end = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 84 26" aria-hidden="true"><polygon class="fill" points="' + line + ' 82,26 2,26"/><polyline points="' + line + '"/><circle class="dot" cx="' + end[0].toFixed(1) + '" cy="' + end[1].toFixed(1) + '" r="2.5"/></svg>';
}

function render(){
  const isToday = view === "today";
  const list = isToday ? sortedToday() : sorted();

  if (isToday){
    const king = list[0];
    const finalHour = msToMidnightUTC() < 3600000;
    if (king && state.todayDecree && state.todayDecree.id !== king.id) delete state.todayDecree;
    $("#crown").innerHTML = king
      ? '<div class="crown-card' + (finalHour ? ' final' : '') + '">' +
        '<div class="crown-emoji">' + (finalHour ? '⏳' : '🔥') + '</div>' +
        '<div><div class="crown-name">' + esc(king.name) + '</div>' +
        '<div class="crown-sub"><span class="final-tag">FINAL HOUR — </span>King of Today · resets in <b class="num">' + dur(msToMidnightUTC()) + '</b></div>' +
        '<div class="crown-sub">Win the day and enter the Hall of Fame forever</div>' +
        (state.todayDecree ? '<div class="decree">' + esc(state.todayDecree.text) + '</div>' : '') + '</div>' +
        '<div class="crown-right"><div class="crown-amt num">' + fmt(king.todayTotal) + '</div>' +
        '<button class="take" data-take="' + king.id + '">Take today\'s crown — ' + fmt(king.todayTotal+1) + '<small>everyone starts even again at midnight</small></button></div></div>'
      : '<div class="crown-card">' +
        '<div class="crown-emoji">🔥</div>' +
        '<div><div class="crown-name">Nobody has bid today</div>' +
        '<div class="crown-sub">Today\'s crown is basically free. Resets in <b class="num">' + dur(msToMidnightUTC()) + '</b>.</div></div>' +
        '<div class="crown-right"><button class="take" data-open-bid>Take it — ' + fmt(MIN_NEW) + '</button></div></div>';
  } else {
    const top = list[0];
    $("#crown").innerHTML =
      '<div class="crown-card">' +
        '<div class="crown-emoji">👑</div>' +
        '<div><div class="crown-name">' + esc(top.name) + '</div>' +
        '<div class="crown-sub">' + esc(top.url) + ' · reigning <b class="num" id="reignClock">' + dur(Date.now()-state.crownedAt) + '</b></div>' +
        '<div class="crown-sub">Longest reign ever: <b>' + esc(state.longestReign.name) + '</b> — ' + dur(state.longestReign.ms) + '</div>' +
        (state.decree ? '<div class="decree">' + esc(state.decree.text) + '</div>' : '') + '</div>' +
        '<div class="crown-right"><div class="crown-amt num">' + fmt(top.total) + '</div>' +
        '<button class="take" data-take="' + top.id + '">Dethrone — ' + fmt(top.total+1) + ' total<small>top-ups only pay the difference</small></button>' +
        '<a class="dare" id="dareLink" href="' + tweetIntent("Someone paid " + fmt(top.total) + " to be #1 on OUTRANKED. It costs exactly " + fmt(top.total+1) + " to take it from them: " + SHARE_URL) + '" target="_blank" rel="noopener">📣 dare someone to dethrone them</a></div></div>';
  }

  const q = query.trim().toLowerCase();
  $("#board").innerHTML = list.map((e,i) => {
    if (q && !(e.name.toLowerCase().includes(q) || e.url.toLowerCase().includes(q))) return "";
    const rank = i+1;
    let mv = '<span class="mv same">–</span>';
    if (!isToday){
      const prev = prevRanks[e.id];
      if (prev && prev > rank) mv = '<span class="mv up">▲' + (prev-rank) + '</span>';
      else if (prev && prev < rank) mv = '<span class="mv down">▼' + (rank-prev) + '</span>';
    }
    const hot = e.history.length > 3 && e.history[e.history.length-1] - e.history[e.history.length-4] > e.total*0.25;
    const amt = isToday ? e.todayTotal : e.total;
    const sub = isToday ? ('all-time ' + fmt(e.total)) : (e.bids + ' bid' + (e.bids === 1 ? '' : 's'));
    const takeLabel = rank === 1 ? (isToday ? 'Take today\'s #1' : 'Dethrone') : 'Take #' + rank;
    const titles = (e.titles||[]).slice(0,2).map(t => '<span class="badge title">' + t + '</span>').join("");
    const more = (e.titles||[]).length > 2 ? '<span class="badge title">+' + (e.titles.length-2) + '</span>' : '';
    return '<div class="row" data-id="' + e.id + '">' +
      '<div class="rank num">' + rank + mv + '</div>' +
      '<div class="who">' + medallion(e) + '<div><span class="nm">' + esc(e.name) +
        (e.defend > 0 ? ' <span class="badge shield" title="Auto-defend armed">🛡 DEFENDED</span>' : '') +
        (hot ? ' <span class="badge hot">🔥 HOT</span>' : '') + titles + more +
        (e.streak > 1 ? ' <span class="badge title">👑 ' + e.streak + '-day streak</span>' : '') + '</span>' +
        '<span class="tiername">' + tier(e).name + '</span>' +
        '<a class="url" href="https://' + esc(e.url) + '" target="_blank" rel="noopener nofollow">' + esc(e.url) + '</a></div></div>' +
      spark(e.history) +
      '<div class="money"><div class="amt num">' + fmt(amt) + '</div>' +
      '<div class="bids num">' + sub + '</div>' +
      '<button class="take" data-take="' + e.id + '">' + takeLabel + ' — ' + fmt(amt+1) + '</button></div></div>';
  }).join("") || (isToday && !q
    ? '<div class="row" style="grid-template-columns:1fr;color:var(--muted)">No bids yet today — first ' + fmt(MIN_NEW) + ' owns the board until midnight.</div>'
    : '<div class="row" style="grid-template-columns:1fr;color:var(--muted)">Nothing matches "' + esc(query) + '".</div>');

  $("#statRaised").textContent = fmt(state.entries.reduce((s,e) => s+e.total, 0));
  $("#statBids").textContent = state.stats.bids.toLocaleString();
  $("#statBiggest").textContent = fmt(state.stats.biggest);
  $("#statSpots").textContent = state.entries.length.toLocaleString();

  const items = state.feed.slice(0,12).map(f => '<span class="tick">' + f + '</span>').join("");
  $("#tickerInner").innerHTML = items + items;

  $("#hall").innerHTML = (state.hall && state.hall.length)
    ? '<span class="h-title">🏆 Hall of Fame</span>' + state.hall.slice(0,14).map(h =>
        '<span class="trophy"><b>' + esc(h.name) + '</b>' + h.date + ' · <span class="num">' + fmt(h.amount) + '</span></span>').join("")
    : "";

  if (!isToday) prevRanks = rankMap();
  renderWatch();
}

/* ---------- bidding ---------- */
const modal = $("#bidModal");
function openBid(targetId){
  $("#bidErr").classList.remove("show");
  if (targetId){
    const t = state.entries.find(e => e.id === targetId);
    const isToday = view === "today";
    const beat = isToday ? ensureToday(t).todayTotal : t.total;
    const rank = isToday ? (sortedToday().indexOf(t)+1 || 1) : rankMap()[t.id];
    $("#modalTitle").textContent = rank === 1 ? "Dethrone " + t.name : "Overtake " + t.name + " (#" + rank + ")";
    $("#modalSub").textContent = isToday
      ? "They've bid " + fmt(beat) + " today. " + fmt(beat+1) + " takes the spot until midnight."
      : "They sit at " + fmt(t.total) + ". Beat it or boost your own spot.";
    $("#fAmt").value = Math.max(MIN_NEW, beat+1);
    $("#amtHint").textContent = "Prefilled to beat them by $1 — raise it to build a moat.";
  } else {
    $("#modalTitle").textContent = "Claim a spot";
    $("#modalSub").textContent = "$5 minimum. Your total is your rank.";
    $("#amtHint").textContent = "";
    $("#fAmt").value = "";
  }
  modal.showModal();
  $("#fName").focus();
}

function checkCrown(){
  const top = sorted()[0];
  if (top.id !== state.crownId){
    const reignMs = Date.now() - state.crownedAt;
    const old = state.entries.find(e => e.id === state.crownId);
    if (reignMs > state.longestReign.ms && old) state.longestReign = { name: old.name, ms: reignMs };
    if (old) feed('👑 <b>' + esc(top.name) + '</b> DETHRONED <b>' + esc(old.name) + '</b> after a ' + dur(reignMs) + ' reign');
    award(top, "⚔️ Kingslayer");
    delete state.decree;
    state.crownId = top.id;
    state.crownedAt = Date.now();
  }
}

function runAutoDefend(aggressor){
  let acted = true, guard = 0;
  while (acted && guard++ < 50){
    acted = false;
    const list = sorted();
    for (const e of list){
      if (e.defend <= 0 || e.id === aggressor.id) continue;
      const myRank = list.indexOf(e);
      const justAhead = list[myRank-1];
      if (justAhead && justAhead.id === aggressor.id && e.defend >= 1){
        const need = Math.min(e.defend, justAhead.total - e.total + 1);
        if (need > 0){
          e.total += need; e.defend -= need; e.bids++; e.history.push(e.total);
          touchToday(e, need);
          state.stats.bids++;
          feed('🛡 <b>' + esc(e.name) + '</b> auto-defended with <span class="amt">' + fmt(need) + '</span> — back above <b>' + esc(aggressor.name) + '</b>');
          award(e, "🛡 Defender");
          acted = true;
        }
      }
    }
  }
  checkCrown();
}

function placeBid(name, url, amount, defendBudget){
  name = name.trim(); url = url.trim().replace(/^https?:\/\//, "");
  let entry = state.entries.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (entry){
    entry.total += amount; entry.bids++; entry.history.push(entry.total);
    if (entry.history.length > 24) entry.history = entry.history.slice(-24);
  } else {
    if (amount < MIN_NEW) return { ok:false, msg: "New listings start at " + fmt(MIN_NEW) + "." };
    entry = { id: "u" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36), name, url: url || "—", total: amount, bids: 1, history: [amount], defend: 0 };
    state.entries.push(entry);
  }
  touchToday(entry, amount);
  if (amount >= 500) award(entry, "🐋 Whale");
  if (defendBudget > 0) entry.defend = defendBudget;
  state.stats.bids++;
  state.stats.biggest = Math.max(state.stats.biggest, amount);
  const rank = rankMap()[entry.id];
  feed('<b>' + esc(entry.name) + '</b> bid <span class="amt">' + fmt(amount) + '</span> → now #' + rank);
  checkCrown();
  runAutoDefend(entry);
  return { ok:true, entry, rank: rankMap()[entry.id] };
}

/* ---------- watch mode ---------- */
let watchOn = false, wBoard = "today";
setInterval(() => { if (watchOn){ wBoard = wBoard === "today" ? "all" : "today"; renderWatch(); } }, 8000);
function renderWatch(){
  if (!watchOn) return;
  const kToday = sortedToday()[0];
  const kAll = sorted()[0];
  const finalHour = msToMidnightUTC() < 3600000;
  const isT = wBoard === "today" && !!kToday;
  const king = isT ? kToday : kAll;
  const decree = isT ? state.todayDecree : state.decree;
  $("#wCrown").innerHTML =
    '<div class="lbl">' + (isT ? (finalHour ? "⏳ FINAL HOUR — king of today" : "🔥 King of today") : "👑 All-time champion") + '</div>' +
    '<div class="nm">' + esc(king.name) + '</div>' +
    '<div class="amt">' + fmt(isT ? king.todayTotal : king.total) + '</div>' +
    '<div class="sub">' + (isT ? "board resets in " + dur(msToMidnightUTC()) : "reigning " + dur(Date.now()-state.crownedAt)) +
    ' · dethroning costs ' + fmt((isT ? king.todayTotal : king.total) + 1) + '</div>' +
    (decree ? '<div class="decree">' + esc(decree.text) + '</div>' : '');
  const raised = state.entries.reduce((s,e)=>s+e.total,0);
  $("#wStats").innerHTML =
    '<div class="w-stat"><b>' + fmt(raised) + '</b><span>Total raised</span></div>' +
    '<div class="w-stat"><b>' + state.stats.bids.toLocaleString() + '</b><span>Bids</span></div>' +
    '<div class="w-stat"><b>' + fmt(state.stats.biggest) + '</b><span>Biggest bid</span></div>';
  $("#wFeed").innerHTML = state.feed.slice(0,9).map(f => '<div class="ev">' + f + '</div>').join("");
  $("#wUrl").textContent = "Every viewer of this page bids on the same board — pay more, rank higher, stay on top";
}
function setWatch(on){
  watchOn = on;
  $("#watch").classList.toggle("on", on);
  document.documentElement.style.overflow = on ? "hidden" : "";
  if (on) renderWatch();
}
$("#watchBtn").addEventListener("click", () => setWatch(true));
$("#watchClose").addEventListener("click", () => setWatch(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && watchOn) setWatch(false); });

/* ---------- listing dossier ---------- */
const detailModal = $("#detailModal");
function sparkBig(hist){
  const h = hist.slice(-24); if (h.length < 2) h.unshift(0);
  const max = Math.max(...h), min = Math.min(...h), span = (max-min) || 1;
  const pts = h.map((v,i) => [(i/(h.length-1))*296+2, 58-((v-min)/span)*48+3]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const end = pts[pts.length-1];
  return '<svg class="d-spark" viewBox="0 0 300 64" aria-hidden="true"><polygon class="fill" points="' + line + ' 298,64 2,64"/><polyline points="' + line + '"/><circle class="dot" cx="' + end[0].toFixed(1) + '" cy="' + end[1].toFixed(1) + '" r="3"/></svg>';
}
function openDetail(id){
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  ensureToday(e);
  const t = tier(e);
  const rank = rankMap()[e.id];
  const avg = e.bids ? Math.round(e.total/e.bids) : e.total;
  const badges = [
    '<span class="badge title">' + t.name + '</span>',
    ...(e.titles||[]).map(x => '<span class="badge title">' + x + '</span>'),
    e.streak > 1 ? '<span class="badge title">👑 ' + e.streak + '-day streak</span>' : "",
    e.defend > 0 ? '<span class="badge shield">🛡 defending with ' + fmt(e.defend) + '</span>' : "",
  ].filter(Boolean).join("");
  $("#detailBody").innerHTML =
    '<div class="d-head">' + medallion(e) +
      '<div><div class="nm">' + esc(e.name) + '</div>' +
      '<div class="t">#' + rank + ' all-time · <a href="https://' + esc(e.url) + '" target="_blank" rel="noopener nofollow">' + esc(e.url) + '</a></div></div></div>' +
    '<div class="d-badges">' + badges + '</div>' +
    sparkBig(e.history) +
    '<div class="d-grid">' +
      '<div class="d-cell"><b>' + fmt(e.total) + '</b><span>All-time</span></div>' +
      '<div class="d-cell"><b>' + fmt(e.todayTotal||0) + '</b><span>Today</span></div>' +
      '<div class="d-cell"><b>' + e.bids + '</b><span>Bids</span></div>' +
      '<div class="d-cell"><b>' + fmt(avg) + '</b><span>Avg bid</span></div>' +
      '<div class="d-cell"><b>' + (e.titles||[]).length + '</b><span>Titles</span></div>' +
      '<div class="d-cell"><b>' + fmt((view==="today" ? (e.todayTotal||0) : e.total) + 1) + '</b><span>To take</span></div>' +
    '</div>' +
    '<div class="mrow">' +
      '<button type="button" class="ghost" data-close-detail>Close</button>' +
      '<a class="ghost" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="' +
        tweetIntent(e.name + " sits at #" + rank + " on OUTRANKED with " + fmt(e.total) + ". Taking it costs " + fmt(e.total+1) + ": " + SHARE_URL) + '">Dare on 𝕏</a>' +
      '<button type="button" class="cta" data-boost="' + e.id + '">Boost — ' + fmt((view==="today" ? (e.todayTotal||0) : e.total) + 1) + '</button>' +
    '</div>';
  detailModal.showModal();
}

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const take = e.target.closest("[data-take]");
  if (take) return openBid(take.dataset.take);
  const boost = e.target.closest("[data-boost]");
  if (boost){ detailModal.close(); return openBid(boost.dataset.boost); }
  if (e.target.closest("[data-close-detail]")) return detailModal.close();
  if (e.target.closest("[data-open-bid]")) return openBid(null);
  if (e.target.closest("[data-close]")) return modal.close();
  const tab = e.target.closest(".tab[data-view]");
  if (tab){
    view = tab.dataset.view;
    document.querySelectorAll(".tab").forEach(t => {
      const on = t.dataset.view === view;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on);
    });
    render();
    return;
  }
  if (e.target.closest("a.url")) return;
  const row = e.target.closest("#board .row[data-id]");
  if (row) openDetail(row.dataset.id);
});
$("#fDefend").addEventListener("change", e => { $("#fBudget").disabled = !e.target.checked; if (e.target.checked) $("#fBudget").focus(); });
$("#bidForm").addEventListener("submit", e => {
  e.preventDefault();
  const err = $("#bidErr");
  const name = $("#fName").value, url = $("#fUrl").value;
  const amount = Math.floor(+$("#fAmt").value);
  const defendBudget = $("#fDefend").checked ? Math.max(0, Math.floor(+$("#fBudget").value || 0)) : 0;
  if (!name.trim()){ err.textContent = "A name is required — this is a leaderboard, not witness protection."; err.classList.add("show"); return; }
  if (!amount || amount < 1){ err.textContent = "Bid at least $1."; err.classList.add("show"); return; }
  const res = placeBid(name, url, amount, defendBudget);
  if (!res.ok){ err.textContent = res.msg; err.classList.add("show"); return; }
  const decree = $("#fDecree").value.trim().slice(0,80);
  if (decree){
    if (state.crownId === res.entry.id){
      state.decree = { text: decree, by: res.entry.name, id: res.entry.id };
      feed('📜 King <b>' + esc(res.entry.name) + '</b> decrees: <b>“' + esc(decree) + '”</b>');
    }
    const kT = sortedToday()[0];
    if (kT && kT.id === res.entry.id){
      state.todayDecree = { text: decree, by: res.entry.name, id: res.entry.id };
      if (state.crownId !== res.entry.id) feed('📜 Today\'s king <b>' + esc(res.entry.name) + '</b> decrees: <b>“' + esc(decree) + '”</b>');
    }
  }
  $("#fDecree").value = "";
  modal.close();
  const brag = tweetIntent("I just paid " + fmt(amount) + " to make " + res.entry.name + " #" + res.rank + " on OUTRANKED 👑 Outbid me if you dare: " + SHARE_URL);
  commit("💸 Paid " + fmt(amount) + " — " + res.entry.name + " is #" + res.rank + (defendBudget ? " · 🛡 defending with " + fmt(defendBudget) : ""), brag);
});
$("#search").addEventListener("input", e => { query = e.target.value; render(); });

let toastTimer;
function showToast(text){
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
}

/* ---------- viral loops + celebration ---------- */
const SHARE_URL = "https://claude.ai/code/artifact/2e073757-ea85-49b4-b889-f43609793991";
function tweetIntent(text){ return "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text); }
let shareTimer;
function showShareBar(href){
  if (!href) return;
  $("#bragBtn").href = href;
  $("#sharebar").classList.add("show");
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => $("#sharebar").classList.remove("show"), 30000);
}
$("#shareClose").addEventListener("click", () => $("#sharebar").classList.remove("show"));

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#F5A524","#0E9F5B","#7B61FF","#FF5A4E"];
  const bits = Array.from({length: 90}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*160, y: innerHeight*0.62,
    vx: (Math.random()-.5)*11, vy: -(5+Math.random()*9),
    s: 4+Math.random()*4, c: colors[Math.floor(Math.random()*colors.length)], r: Math.random()*Math.PI
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for (const b of bits){
      b.x += b.vx; b.y += b.vy; b.vy += .32; b.r += .1;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s/2,-b.s/2,b.s,b.s); ctx.restore();
    }
    if (++frames < 110) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* Show toast + brag bar + confetti — directly in sandbox mode, or after the
   publish-triggered reload via the sessionStorage stash. */
function celebrate(){
  try {
    const raw = sessionStorage.getItem("outranked_celebrate");
    if (!raw) return;
    sessionStorage.removeItem("outranked_celebrate");
    const { t, b } = JSON.parse(raw);
    if (t) showToast(t);
    showShareBar(b);
    confetti();
  } catch(e) {}
}

render();
setInterval(() => { const el = $("#reignClock"); if (el) el.textContent = dur(Date.now() - state.crownedAt); }, 30000);
celebrate();
</script>

/* ---------- self-publishing machinery ---------- */
let store = null, readOnly = false, storeReady;
if (typeof claude !== "undefined" && claude.use) {
  storeReady = claude.use("artifact").then(ns => { store = ns; if (!store) localNote(); }).catch(() => localNote());
} else { storeReady = Promise.resolve(); localNote(); }

function localNote(){
  const b = $("#banner");
  b.innerHTML = "<b>Sandbox view</b> — live sync isn't available here, so bids stay on this device. Everything else works.";
  b.classList.add("show");
}
function readOnlyNote(){
  readOnly = true;
  const b = $("#banner");
  b.innerHTML = "<b>Read-only view</b> — you can watch the board live, but your bids stay on this device.";
  b.classList.add("show");
}

function buildHTML(st){
  const json = JSON.stringify(st).replace(/</g, "\\u003c");
  const src = BOOT_SRC
    .replace(/\/\*STATE\*\/[\s\S]*?\/\*END\*\//, () => "/*STATE*/" + json + "/*END*/");
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>OUTRANKED</title>\n</head>\n<body>\n<script id="boot">' + src + '</scr' + 'ipt>\n</body>\n</html>\n';
}

async function commit(toastMsg){
  try { sessionStorage.setItem("outranked_toast", toastMsg); } catch(e) {}
  await storeReady;
  if (!store || readOnly) { render(); showToast(toastMsg); return; }
  try {
    await store.publish(buildHTML(state));   /* success → this view reloads */
  } catch (e) {
    const code = e && e.code;
    if (code === "conflict") return;         /* a newer version won; reload is coming */
    if (code === "not_granted" || code === "not_writer" || code === "consent_required" ||
        code === "capability_disabled" || code === "capability_removed" || code === "not_declared") {
      readOnlyNote(); render(); showToast(toastMsg); return;
    }
    if (code === "rate_limited") { render(); showToast("Easy, tycoon — bids are coming in too fast. Yours is kept on this device."); return; }
    render(); showToast("Couldn't sync that bid — it's kept on this device.");
  }
}

/* ---------- state helpers ---------- */
const state = STATE;
let query = "";
function sorted(){ return [...state.entries].sort((a,b) => b.total - a.total); }
function rankMap(){ const m = {}; sorted().forEach((e,i) => m[e.id] = i+1); return m; }
let prevRanks = rankMap();
function dur(ms){
  const m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if (d>0) return d + "d " + (h%24) + "h"; if (h>0) return h + "h " + (m%60) + "m"; return m + "m";
}
function feed(html){ state.feed.unshift(html); state.feed = state.feed.slice(0,20); }

/* ---------- rendering ---------- */
function spark(hist){
  const h = hist.slice(-12); if (h.length < 2) h.unshift(0);
  const max = Math.max(...h), min = Math.min(...h), span = (max-min) || 1;
  const pts = h.map((v,i) => [(i/(h.length-1))*80+2, 24-((v-min)/span)*20+1]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const end = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 84 26" aria-hidden="true"><polygon class="fill" points="' + line + ' 82,26 2,26"/><polyline points="' + line + '"/><circle class="dot" cx="' + end[0].toFixed(1) + '" cy="' + end[1].toFixed(1) + '" r="2.5"/></svg>';
}

function render(){
  const list = sorted();
  const top = list[0];
  $("#crown").innerHTML =
    '<div class="crown-card">' +
      '<div class="crown-emoji">👑</div>' +
      '<div><div class="crown-name">' + esc(top.name) + '</div>' +
      '<div class="crown-sub">' + esc(top.url) + ' · reigning <b class="num" id="reignClock">' + dur(Date.now()-state.crownedAt) + '</b></div>' +
      '<div class="crown-sub">Longest reign ever: <b>' + esc(state.longestReign.name) + '</b> — ' + dur(state.longestReign.ms) + '</div></div>' +
      '<div class="crown-right"><div class="crown-amt num">' + fmt(top.total) + '</div>' +
      '<button class="take" data-take="' + top.id + '">Dethrone — ' + fmt(top.total+1) + ' total<small>top-ups only pay the difference</small></button></div></div>';

  const q = query.trim().toLowerCase();
  const ranks = rankMap();
  $("#board").innerHTML = list.map((e,i) => {
    if (q && !(e.name.toLowerCase().includes(q) || e.url.toLowerCase().includes(q))) return "";
    const rank = i+1, prev = prevRanks[e.id];
    let mv = '<span class="mv same">–</span>';
    if (prev && prev > rank) mv = '<span class="mv up">▲' + (prev-rank) + '</span>';
    else if (prev && prev < rank) mv = '<span class="mv down">▼' + (rank-prev) + '</span>';
    const hot = e.history.length > 3 && e.history[e.history.length-1] - e.history[e.history.length-4] > e.total*0.25;
    return '<div class="row" data-id="' + e.id + '">' +
      '<div class="rank num">' + rank + mv + '</div>' +
      '<div class="who"><span class="nm">' + esc(e.name) +
        (e.defend > 0 ? ' <span class="badge shield" title="Auto-defend armed">🛡 DEFENDED</span>' : '') +
        (hot ? ' <span class="badge hot">🔥 HOT</span>' : '') + '</span>' +
        '<a class="url" href="https://' + esc(e.url) + '" target="_blank" rel="noopener nofollow">' + esc(e.url) + '</a></div>' +
      spark(e.history) +
      '<div class="money"><div class="amt num">' + fmt(e.total) + '</div>' +
      '<div class="bids num">' + e.bids + ' bid' + (e.bids === 1 ? '' : 's') + '</div>' +
      '<button class="take" data-take="' + e.id + '">' + (rank === 1 ? 'Dethrone' : 'Take #' + rank) + ' — ' + fmt(e.total+1) + '</button></div></div>';
  }).join("") || '<div class="row" style="grid-template-columns:1fr;color:var(--muted)">Nothing matches "' + esc(query) + '".</div>';

  $("#statRaised").textContent = fmt(state.entries.reduce((s,e) => s+e.total, 0));
  $("#statBids").textContent = state.stats.bids.toLocaleString();
  $("#statBiggest").textContent = fmt(state.stats.biggest);
  $("#statSpots").textContent = state.entries.length.toLocaleString();

  const items = state.feed.slice(0,12).map(f => '<span class="tick">' + f + '</span>').join("");
  $("#tickerInner").innerHTML = items + items;
  prevRanks = ranks;
}

/* ---------- bidding ---------- */
const modal = $("#bidModal");
function openBid(targetId){
  $("#bidErr").classList.remove("show");
  if (targetId){
    const t = state.entries.find(e => e.id === targetId);
    const rank = rankMap()[t.id];
    $("#modalTitle").textContent = rank === 1 ? "Dethrone " + t.name : "Overtake " + t.name + " (#" + rank + ")";
    $("#modalSub").textContent = "They sit at " + fmt(t.total) + ". Beat it or boost your own spot.";
    $("#amtHint").textContent = "Bid under your own name — totals stack, so top-ups only pay the difference.";
  } else {
    $("#modalTitle").textContent = "Claim a spot";
    $("#modalSub").textContent = "$5 minimum. Your total is your rank.";
    $("#amtHint").textContent = "";
  }
  $("#fAmt").value = "";
  modal.showModal();
  $("#fName").focus();
}

function checkCrown(){
  const top = sorted()[0];
  if (top.id !== state.crownId){
    const reignMs = Date.now() - state.crownedAt;
    const old = state.entries.find(e => e.id === state.crownId);
    if (reignMs > state.longestReign.ms && old) state.longestReign = { name: old.name, ms: reignMs };
    if (old) feed('👑 <b>' + esc(top.name) + '</b> DETHRONED <b>' + esc(old.name) + '</b> after a ' + dur(reignMs) + ' reign');
    state.crownId = top.id;
    state.crownedAt = Date.now();
  }
}

function runAutoDefend(aggressor){
  let acted = true, guard = 0;
  while (acted && guard++ < 50){
    acted = false;
    const list = sorted();
    for (const e of list){
      if (e.defend <= 0 || e.id === aggressor.id) continue;
      const myRank = list.indexOf(e);
      const justAhead = list[myRank-1];
      if (justAhead && justAhead.id === aggressor.id && e.defend >= 1){
        const need = Math.min(e.defend, justAhead.total - e.total + 1);
        if (need > 0){
          e.total += need; e.defend -= need; e.bids++; e.history.push(e.total);
          state.stats.bids++;
          feed('🛡 <b>' + esc(e.name) + '</b> auto-defended with <span class="amt">' + fmt(need) + '</span> — back above <b>' + esc(aggressor.name) + '</b>');
          acted = true;
        }
      }
    }
  }
  checkCrown();
}

function placeBid(name, url, amount, defendBudget){
  name = name.trim(); url = url.trim().replace(/^https?:\/\//, "");
  let entry = state.entries.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (entry){
    entry.total += amount; entry.bids++; entry.history.push(entry.total);
    if (entry.history.length > 24) entry.history = entry.history.slice(-24);
  } else {
    if (amount < MIN_NEW) return { ok:false, msg: "New listings start at " + fmt(MIN_NEW) + "." };
    entry = { id: "u" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36), name, url: url || "—", total: amount, bids: 1, history: [amount], defend: 0 };
    state.entries.push(entry);
  }
  if (defendBudget > 0) entry.defend = defendBudget;
  state.stats.bids++;
  state.stats.biggest = Math.max(state.stats.biggest, amount);
  const rank = rankMap()[entry.id];
  feed('<b>' + esc(entry.name) + '</b> bid <span class="amt">' + fmt(amount) + '</span> → now #' + rank);
  checkCrown();
  runAutoDefend(entry);
  return { ok:true, entry, rank: rankMap()[entry.id] };
}

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const take = e.target.closest("[data-take]");
  if (take) return openBid(take.dataset.take);
  if (e.target.closest("[data-open-bid]")) return openBid(null);
  if (e.target.closest("[data-close]")) return modal.close();
});
$("#fDefend").addEventListener("change", e => { $("#fBudget").disabled = !e.target.checked; if (e.target.checked) $("#fBudget").focus(); });
$("#bidForm").addEventListener("submit", e => {
  e.preventDefault();
  const err = $("#bidErr");
  const name = $("#fName").value, url = $("#fUrl").value;
  const amount = Math.floor(+$("#fAmt").value);
  const defendBudget = $("#fDefend").checked ? Math.max(0, Math.floor(+$("#fBudget").value || 0)) : 0;
  if (!name.trim()){ err.textContent = "A name is required — this is a leaderboard, not witness protection."; err.classList.add("show"); return; }
  if (!amount || amount < 1){ err.textContent = "Bid at least $1."; err.classList.add("show"); return; }
  const res = placeBid(name, url, amount, defendBudget);
  if (!res.ok){ err.textContent = res.msg; err.classList.add("show"); return; }
  modal.close();
  commit("💸 Paid " + fmt(amount) + " — " + res.entry.name + " is #" + res.rank + (defendBudget ? " · 🛡 defending with " + fmt(defendBudget) : ""));
});
$("#search").addEventListener("input", e => { query = e.target.value; render(); });

let toastTimer;
function showToast(text){
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
}

render();
setInterval(() => { const el = $("#reignClock"); if (el) el.textContent = dur(Date.now() - state.crownedAt); }, 30000);
try {
  const t = sessionStorage.getItem("outranked_toast");
  if (t){ sessionStorage.removeItem("outranked_toast"); showToast(t); }
} catch(e) {}
</script>
</body>
</html>

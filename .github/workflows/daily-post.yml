name: Daily X post (marketing robot)

# Scheduled workflows run from the DEFAULT branch, so this activates as soon as
# the repo exists with these files on main. Without the four X_* secrets set,
# the job runs and exits quietly.
on:
  schedule:
    - cron: "5 0 * * *"    # 00:05 UTC — "the board just reset"
    - cron: "0 14 * * *"   # 14:00 UTC — the morning stats ritual
    - cron: "0 23 * * *"   # 23:00 UTC — the Final Hour snipe alert
    - cron: "0 15 * * 0"   # Sun 15:00 UTC — the weekly hall-of-fame recap
  workflow_dispatch:
    inputs:
      mode:
        description: "Which post to run"
        type: choice
        options: [ritual, reset, final, week]
        default: ritual
      dry_run:
        description: "Preview only — print the post instead of sending it"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/daily-post.mjs
